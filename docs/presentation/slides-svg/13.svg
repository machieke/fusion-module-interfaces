<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">One slice crosses real process and storage boundaries</title>
<desc id="desc">The arrows summarize the logical sequence; reads and writes from the worker pass through the atom/storage adapter, even when omitted for clarity. Peer A creates a generated 62-byte fixture through AtomStorage into real DeTTa. It sends the reference through the durable mailbox. Peer B receives it and fetches exactly the same bytes. A submits inspect_atom; the separate worker reads the referenced bytes and returns their digest and length. The demo kills the worker twice at persisted boundaries, restarts, then recovers a correlated completion and result. Every acknowledgement refers to its stated durability scope. Both service bindings use the same Peer code and validation. The peers and operation are fixtures, not Omega agents or reasoning.</desc>
