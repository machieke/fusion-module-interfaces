<title id="title">The intended Hive source now has a verified entrypoint</title>
<desc id="desc">The old runtime-unavailable statement is historical. The user supplied clean omegahive-schematics 4af00db4e395375484dd48d0b9068a59afcf01f8; its component map names 34b0fb3. Authorized SSH retrieved PhysixSNET/omegahive at 34b0fb32ab3806e5609fc89bb7535518a35e1aea. The different observed remote HEAD was not silently selected. Native startup is python -m hive. The test driver uses its lock, startup recovery and create_app in a separate OS process, with real PeTTa and the default Supervisor. It signs in and traverses the actual Programs route. Native baseline tests have their declared fake process driver; the new real-caller tests do not. No LLM or mind is started. This pin selects an engineering experiment, not a final community product release.</desc>
