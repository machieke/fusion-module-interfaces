<text x="70" y="139.65" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#102B3F">One slice crosses real process and storage boundaries</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Two independent protocol peers. One allowlisted operation. Two interchangeable service bindings.</text>
