<text x="788" y="657.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Calculation may repeat; CAS and replay guard the effect.</text>
<rect x="72" y="681" width="1456" height="57" rx="6" fill="#FFFFFF"/>
<text x="88" y="719.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">4 · C2 committed; no C1 acknowledgement</text>
<text x="788" y="719.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Recover the same decision, then acknowledge separately.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="800.65" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#102B3F">All four boundaries also run through the actual native Hive caller’s restart path.</text>
