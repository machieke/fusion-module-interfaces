<title id="title">A real result digest reached a real local chain</title>
<desc id="desc">Read the recorded chain JSON as the primary evidence. Its actual sequence is pending, included with effects Pending, then finalized. All three observations are present; the earlier report prose was corrected to match this trace. The block is height 3, execution errored=false, rejection count zero, cost 351 phlo. The approved commitment digest matches the persisted result ref in both demo bindings. Signing intent is stored before network submission, so an ambiguous timeout can reuse the same transaction signature. The local node was built from the inspected dirty working source and shut down with exit 0. Node startup took 25.735 seconds and the observed submission/propose/finality window took 4.013 seconds. These node responses are not independently verified consensus proofs or a public-network test.</desc>
