<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Native-path refusals preserve authorization and replay</title>
<desc id="desc">Every row here is tested through the actual native route, except the trusted operator&#x27;s setup/failure injection. The first row is rejected by Hive before plugin effects. The plugin uses the authenticated actor/swarm mapping and current module credentials; it cannot nominate a principal in the request body. Changed descriptor identity fails binding consistency at the server even if its advertised method set looks compatible. Cached success still requires live status/get/poll/ack authority. The worker rechecks its own and requester permissions after admission. Fusion&#x27;s credential/scope policy is explicitly a local test policy, not production SCS or isolation against the same OS user.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / AUTHORIZATION · FAIL CLOSED</text>
<text x="70" y="138.7" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#102B3F">Native-path refusals preserve authorization and replay</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">The host and module boundaries each keep their own checks.</text>
