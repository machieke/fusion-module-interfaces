<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Four crash gaps across independent commits</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Restart recovers intent and decisions. Repeated calculation does not add another logical contribution.</text>
