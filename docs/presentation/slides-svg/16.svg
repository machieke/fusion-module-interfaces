<title id="title">The DA boundary carries bytes, not cognition</title>
<desc id="desc">The Rust helper links actual detta-da and detta-storage from the inspected working tree. It maps bytes into an opaque application profile and binds the scope through generic coordinate metadata. The generic DA schema remains application-neutral; Omega-specific reference metadata lives above it. Reads reconstruct and verify persisted Reed–Solomon shares rather than retrieving a cached copy from SQLite. Tests remove the cached full payload and two of six shares and still recover exact bytes. A third missing share and corrupted-share cases fail explicitly; the tests do not establish an exhaustive adversarial-correction guarantee. This is real local library integration, not a running distributed validator/custody network. No certificate or remote replication guarantee is fabricated.</desc>
