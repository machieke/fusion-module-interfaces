<text x="1086" y="352.51" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">SQLite or atomic-file fixture.</text>
<text x="1086" y="389.63" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Same corpus and prefix;</text>
<text x="1086" y="426.75" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">independent predicate</text>
<text x="1086" y="463.87" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">evaluation and persistence.</text>
<text x="76" y="686.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#102B3F">The Search fixture still answers when the primary predicate helper is disabled.</text>
