<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Independent replacements preserve the caller contract</title>
<desc id="desc">M1.1 covers two AtomStorage implementations times two bindings. M5 adds independent atomic-file feed and Search fixtures. Search shares only pure DTO validation, extraction and encoding, not primary SQL, owner transitions or the predicate helper. A regression disables the primary predicate helper while the fixture evaluates positive and empty queries. Native lookup keeps the same consumer, source, corpus and prefix across replacement; the new Search store rebuilds its derived state. Provider choice is bound to an existing caller intent, so substitution uses a fresh request. Attention retains its separately implemented transitions. File providers are labelled fixtures, not second production services. No populated-state migration is claimed.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">02 / PROVIDER REPLACEMENT</text>
<text x="70" y="138.7" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#102B3F">Independent replacements preserve the caller contract</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Select explicit profiles; rebuild derived state through the authoritative source.</text>
<rect x="72" y="252" width="464" height="370" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="94" y="304.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">AtomStorage · M1 / M5</text>
<text x="94" y="352.51" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Real DeTTa-backed owner or</text>
<text x="94" y="389.63" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">atomic-file fixture. The M5</text>
<text x="94" y="426.75" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">feed remains ordered and</text>
<text x="94" y="463.87" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">replayable.</text>
<rect x="568" y="252" width="464" height="370" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="590" y="304.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">Attention · M3</text>
<text x="590" y="352.51" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">SQLite or atomic-file fixture.</text>
<text x="590" y="389.63" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Same STI policy, tasks and</text>
<text x="590" y="426.75" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">budgets; same consumer</text>
<text x="590" y="463.87" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">outcomes.</text>
