<text x="580" y="440.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#A86A15">Known common origin → no extra</text>
<text x="580" y="470.29" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#A86A15">weight</text>
