<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A restarted Hive caller recovers without its old RAM</title>
<desc id="desc">These are actual OS-process kills, not exceptions standing in for restart. The test caller is a native Hive app process with real authentication and dispatch. Trusted configuration enables a SIGSTOP checkpoint; the test waits for its marker and sends SIGKILL. Admission-loss occurs after durable Fusion acceptance but before saving the job in the caller record. Submission-loss occurs after that local record commits. Acceptance-loss occurs after outcome commit and before ack. A new app process signs in against the same native data directory and reconciles the original request. Tests assert stable job identity, two total atoms (input and one result), one outbox, one completion, one caller outcome and no delivery after ack. The receipt is a minimal boundary record, not an episodic-memory implementation.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / RECOVERY · ACTUAL CALLER SIGKILL</text>
<text x="70" y="141.55" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#102B3F">A restarted Hive caller recovers without its old RAM</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Three kill points traverse the same authenticated native action route.</text>
<rect x="72" y="258" width="464" height="345" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="94" y="295.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">AFTER ADMISSION</text>
<text x="94" y="343.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#315E9C">Response lost</text>
<text x="94" y="390.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Fusion accepted the job; the</text>
<text x="94" y="424.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">caller has only its original</text>
<text x="94" y="459.28999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">intent. Same input + key</text>
<text x="94" y="493.84999999999997" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">recovers the same job.</text>
<rect x="94" y="627" width="313.6962890625" height="35" rx="7" fill="#F4E3DC"/>
<text x="108" y="650.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#A84E39">SIGKILL → RESTART → REPLAY</text>
<rect x="568" y="258" width="464" height="345" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="590" y="295.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">AFTER SUBMISSION</text>
<text x="590" y="343.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#315E9C">Caller stops</text>
<text x="590" y="390.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">The local receipt retains the</text>
<text x="590" y="424.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">job. Status /2 restores known</text>
<text x="590" y="459.28999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">correlation after a new</text>
<text x="590" y="493.84999999999997" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">process signs in.</text>
<rect x="590" y="627" width="313.6962890625" height="35" rx="7" fill="#F4E3DC"/>
<text x="604" y="650.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#A84E39">SIGKILL → RESTART → REPLAY</text>
<rect x="1064" y="258" width="464" height="345" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="1086" y="295.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">AFTER ACCEPTANCE</text>
<text x="1086" y="343.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#315E9C">Ack not yet sent</text>
<text x="1086" y="390.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">The outcome is durable.</text>
<text x="1086" y="424.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Redelivery is checked against</text>
<text x="1086" y="459.28999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">it, then acknowledged without</text>
<text x="1086" y="493.84999999999997" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">a second outcome row.</text>
<rect x="1086" y="627" width="313.6962890625" height="35" rx="7" fill="#F4E3DC"/>
<text x="1100" y="650.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#A84E39">SIGKILL → RESTART → REPLAY</text>
<text x="77" y="732.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#007C78">Observed: one job · one result atom · one completion · one accepted outcome identity</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="796.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">Known-job recovery uses durable context and status; unsolicited completions do not establish causality.</text>
