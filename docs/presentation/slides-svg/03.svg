<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: a priority list and a limited attempt budget</title>
<desc id="desc">Short-term importance, or STI, is a simple deterministic priority score. It is separate from PLN truth values. C4 handles a fixed explicit workset; it does not invent new tasks or search the knowledge base. The measured two-task experiment changes initial attention to select the other task while keeping the one-attempt budget fixed. Attempts are durable physical evaluation opportunities. A crash after reservation spends the slot even if no result commits. Successful replay recovers recorded admission and feedback without extra native calls. These are local process-restart observations, not hard real-time or production-quality claims.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 2 OF 3</text>
<text x="70" y="143.45" font-family="DejaVu Sans" font-size="51" font-weight="700" fill="#102B3F">ELI16: a priority list and a limited attempt budget</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">There are two prepared questions, but time for only one calculation. Which should run first?</text>
<rect x="72" y="254" width="464" height="272" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="308.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#315E9C">C3 · Priority list</text>
<text x="94" y="357.07" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Give each eligible task an</text>
<text x="94" y="394.19" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">integer score. Rank it, decay</text>
<text x="94" y="431.31" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">it explicitly, and remember</text>
<text x="94" y="468.43" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">feedback once.</text>
<rect x="568" y="254" width="464" height="272" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="590" y="308.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#007C78">C4 · Work</text>
<text x="590" y="351.82" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#007C78">coordinator</text>
<text x="590" y="399.64000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Choose from that list. Save</text>
<text x="590" y="435.48" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">the attempt reservation</text>
<text x="590" y="471.32000000000005" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">before calculation, then track</text>
<text x="590" y="507.16" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">admission and feedback.</text>
<rect x="1064" y="254" width="464" height="272" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="1086" y="308.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#A86A15">Restart · Same</text>
<text x="1086" y="351.82" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#A86A15">budget</text>
<text x="1086" y="399.64000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Reopening the notebook</text>
<text x="1086" y="435.48" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">does not refill the budget.</text>
<text x="1086" y="471.32000000000005" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Recover a saved decision; do</text>
<text x="1086" y="507.16" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">not credit it twice.</text>
<line x1="536" y1="390" x2="568" y2="390" stroke="#315E9C" stroke-width="2"/>
<polygon points="568,390 555.0,385.0 555.0,395.0" fill="#315E9C"/>
<line x1="1032" y1="390" x2="1064" y2="390" stroke="#007C78" stroke-width="2"/>
<polygon points="1064,390 1051.0,385.0 1051.0,395.0" fill="#007C78"/>
<rect x="72" y="574" width="704" height="159" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="94" y="623.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#007C78">Observed in real Hive</text>
<text x="94" y="667.82" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">One native action, one admitted conclusion, one</text>
<text x="94" y="701.1" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">feedback credit; restart and replay tested.</text>
<rect x="800" y="574" width="728" height="159" rx="13" fill="#FFFFFF" stroke="#A86A15"/>
<text x="822" y="623.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#A86A15">The deliberate tradeoff</text>
<text x="822" y="667.82" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">A crash can spend the last attempt without</text>
<text x="822" y="701.1" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">producing a conclusion. The receipt says so.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="799.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">Priority is not truth. A bounded step finishing is not a promise that a conclusion was found.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M3.1 / C3 attention · C4 bounded inference</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">03 / 44</text>
