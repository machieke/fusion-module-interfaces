<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: a copied report is not a new source</title>
<desc id="desc">This sensor example is an explanatory analogy, not an additional experiment. The actual generated scenario uses the same distinctions: a report without a truth value, an explicit assessment, a copy with the original roots, and a contrary assessment. Admission preserves observations even when numerical aggregation is refused. Known common origins or overlapping evidence block additional weight despite an independence declaration. The operator&#x27;s assertion of independence is an assumption, not proof; undisclosed copying is not detected. A separate generated independent pair exercises actual native revision.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 2 OF 2</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">ELI16: a copied report is not a new source</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Imagine deciding whether a sensor reading is reliable. Keep the source trail, not just the message count.</text>
<rect x="72" y="260" width="410" height="153" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="312.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">Original report</text>
<text x="94" y="358.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">One observation from</text>
<text x="94" y="393.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">source A.</text>
<rect x="592" y="260" width="410" height="153" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="614" y="312.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">Copied report</text>
<text x="614" y="358.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">A second message still</text>
<text x="614" y="393.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">traces to A.</text>
<rect x="1112" y="260" width="416" height="153" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="1134" y="310.5" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#A86A15">Contrary observation</text>
<text x="1134" y="356.04999999999995" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Source B can disagree;</text>
<text x="1134" y="390.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">retain it.</text>
<line x1="482" y1="337" x2="592" y2="337" stroke="#315E9C" stroke-width="2"/>
<polygon points="592,337 579.0,332.0 579.0,342.0" fill="#315E9C"/>
<text x="500" y="314.9" font-family="DejaVu Sans" font-size="22" font-weight="400" fill="#315E9C">copy</text>
<line x1="277" y1="413" x2="277" y2="478" stroke="#315E9C" stroke-width="2"/>
<line x1="277" y1="478" x2="797" y2="478" stroke="#315E9C" stroke-width="2"/>
<line x1="797" y1="478" x2="797" y2="413" stroke="#315E9C" stroke-width="2"/>
<text x="308" y="516.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#315E9C">Same origin → no extra numerical weight</text>
<rect x="72" y="584" width="690" height="147" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="94" y="636.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">Store all three observations</text>
<text x="94" y="680.71" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Remembering a report does not mean believing it.</text>
<rect x="810" y="584" width="718" height="147" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="832" y="634.5" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#007C78">Combine only an eligible pair</text>
<text x="832" y="678.15" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Explicit independence assumption + lineage guards</text>
<text x="832" y="710.15" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">+ native formula.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="799.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">A retry is not a new event. A copy is not a new source. A disagreement is not erased.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M2 / C1 provenance · C2 support coverage</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">03 / 38</text>
</svg>
