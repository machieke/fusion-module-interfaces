<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Fifteen modules; four responsibility groups</title>
<desc id="desc">All fifteen modules remain visible: five cognition modules, five shared application ports, three control/policy functions and two provider-facing responsibilities. Hive is a consumer of these modules, not a newly invented sixteenth module. Dashed violet boxes remain specifications. Blue is the implemented local contract harness. DeTTa is real local DA/FileStorage; an independent file provider is a contract fixture. Finality has a historical real isolated-chain observation from M1, but the M1.2 chain gate was not run. Native Hive authentication is real; the downstream Fusion credential/scope policy remains a development fixture. No cognitive module is implemented by this increment.</desc>
