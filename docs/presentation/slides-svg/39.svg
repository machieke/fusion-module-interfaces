<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Four Relations operations expose accepted structure</title>
<desc id="desc">All four logical operations are executable in schema-ordered-relations/2, contract 2.0.0. Structural identity excludes the transport idempotency key but includes type/schema/direction/ordered roles/scope. Same-key changed semantics fails CONFLICT. requires/1 is dependent to prerequisite; transfer/1 has sender, object and recipient roles; association/1 has symmetric incidence while retaining stored role order. Pagination fixes an accepted-head snapshot; cursors bind operation, direction, endpoint, principal, scope and owner incarnation. Tests cover ordering, repeats, self-links, symmetric and three-role semantics, malformed records, cross-scope denial and crash recovery. The four operations do not imply a general graph database or transitive traversal engine.</desc>
