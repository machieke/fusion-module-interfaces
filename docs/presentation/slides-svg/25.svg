<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The real caller is proven; the cognitive increment is next</title>
<desc id="desc">The stopping point moved from a missing Hive runtime to an evidenced native seam, without implementing M2. The next separately authorized increment can now be chosen from actual integration findings: private episodic provenance and explicitly profiled belief revision remain the cognitive roadmap, followed by attention and bounded inference. Existing upstream mathematics is not redefined here. Production transport/auth/isolation, distributed custody, independently verified proofs, performance characterization and live state migration remain outside this experiment. The minimal caller receipt is not a substitute for episodic memory. Do not describe the future entire Hive workflow or cognition as complete because one deterministic operation is integrated.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">04 / SCOPE AND STOPPING POINT</text>
<text x="70" y="137.75" font-family="DejaVu Sans" font-size="45" font-weight="700" fill="#102B3F">The real caller is proven; the cognitive increment is next</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">M1.2 establishes an integration seam. It does not select a numerical model or implement cognition.</text>
