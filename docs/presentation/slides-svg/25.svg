<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Implementation dependency map</title>
<desc id="desc">Navigate implementation from Peer methods to binding.invoke, then to Service.invoke validation and policy. In-process invokes the service in the current Python process; subprocess invokes the host through private EOF-framed stdin and one JSON stdout response. Trusted composition chooses the concrete storage adapter. Atom, message and execution owner logic is in service.py. The operator-only work and flush entry points are separate from public dispatch. detta.py calls the Rust helper linked to the original DA/storage libraries. chain_demo.py separately registers an approved commitment with F1R3Commitments, injected signer, signed-intent journal and F1R3HTTP. The drawing abstracts call paths; it does not imply contracts import implementation files.</desc>
