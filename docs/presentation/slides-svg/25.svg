<title id="title">Executed suites cover distinct layers of the claim</title>
<desc id="desc">The final comprehensive run is recorded from clean detached d9e75773c34987d5791a9207190fcbf0a8c1fd7b with PYTHONPATH forced to that checkout. The 106-case matrix includes the original 90 tests plus sixteen M2 fixtures; the fifty-one original fixtures and sixteen M2 fixtures are also run separately for isolation. Do not sum those repeated runs as unique tests. DeTTa has 62 DA and 38 storage tests. The 34 selected Hive baseline tests retain their upstream process-driver fixture; thirteen unchanged M1.2 tests and seven M2 tests exercise the real caller. Twelve native revision tests include real computations and deliberately injected malformed responses. Six recovery/privacy tests use actual local providers and SIGKILL. The CLI demo also passed with exact reopen results. Failed development runs remain in the evidence archive and are not counted as passing gates.</desc>
