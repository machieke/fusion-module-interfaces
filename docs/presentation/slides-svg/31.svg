<title id="title">Executed tests cover delivery, races and real crashes</title>
<desc id="desc">The M1–M3 verifier ran completely from corrected source 1b17d74: original fixtures 51, DeTTa-enabled aggregate 127 (118 previous plus nine new), DeTTa 62+38, Hive baseline 34 and unchanged M1.2 integration 13. M2 fixtures/guards/native revision/recovery/Hive: 16/8/12/6/7 plus demo. M3 attention/contracts/guards/native admission/recovery/Hive: 5/7/15/13/3/8 plus four comparison cases. M3.1 explicit fixtures nine, real-provider methods five, direct recovery methods three (sixteen distinct SIGKILL cases) and native Hive seven (four with kills). Two separate non-numerical real-provider probes are retained. Repeated subsets and development reruns are not extra unique coverage. Earlier protocol introspection and harness failures were corrected before this final run. No runtime integrations were rerun for this presentation update.</desc>
