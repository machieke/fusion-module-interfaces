<text x="852" y="584.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">First attempt → B</text>
<text x="78" y="700.65" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#102B3F">Both attention providers preserve this effect; replay adds no native call and no second credit.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="796.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">Attention changes scheduling. It does not alter premise truth values or manufacture independent evidence.</text>
