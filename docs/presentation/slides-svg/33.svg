<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Keep the guarantees inside their observed boundary</title>
<desc id="desc">No new performance benchmark is presented. The original M1 single-sample timing chart has been removed from the current evidence story; those measurements remain in historical JSON. The native build and suite durations are reproducibility observations, not runtime latency or throughput claims. One local worker and one pending caller intent per dedicated route bound the tested profile. Production authorization, multi-host DA custody, generic external effects, live rolling upgrades, named-person/mind action paths, full Hive regression and all cognitive work remain unrun or unsupported. The deck makes no claim that rebuilding slides extends any integration guarantee.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">APPENDIX G / LIMITS AND UNRUN SCOPE</text>
<text x="70" y="140.6" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#102B3F">Keep the guarantees inside their observed boundary</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Local evidence is useful because the untested extensions remain explicit.</text>
<text x="88" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">OBSERVED</text>
<text x="562" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">UNRUN / UNSUPPORTED EXTENSION</text>
<text x="1052" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">WHY IT MATTERS</text>
