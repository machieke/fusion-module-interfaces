<text x="458" y="349.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">processed</text>
<text x="1038" y="317.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Later source commits may exist</text>
<rect x="72" y="381" width="1456" height="99" rx="6" fill="#FFFFFF"/>
<text x="88" y="421.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">Complete page</text>
<text x="458" y="421.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">All matches for this page at its fixed prefix</text>
<text x="1038" y="421.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A continuation can still be required</text>
<rect x="72" y="485" width="1456" height="99" rx="6" fill="#FFFFFF"/>
