<title id="title">Reproducibility connects source, build and observed result</title>
<desc id="desc">Requested ancestor 985d2f34ea8df8c5d93582e4ed6fe5cbe1843074; actual start 8491c4900a5ccab872073e62b1024e3b731aeaf9; tested 55ed5402391ab6ed14f8ab20e1eea4c85d8be955; evidence 05b1c52cfa6ced6e263700753e82ad6038a3b0dd. Implementation commits 1219bb5 and 55ed540 precede evidence-only 05b1c52. The final verifier checked 116 runtime/test/build source hashes at start/end and reran all prior supported regressions. Provider sources, venv, SWI/DeTTa/node builds, compatibility target, test directories and genesis were fresh. Downloads were cached; upstream Rust regression test binaries may be cached between attempts. Provider build began when Fusion recorded 8491c49, but recipes/pins/guard inputs were byte-identical at 55ed540, verified by the committed equivalence artifact; M4 Python plugins loaded from 55ed540. Full source and binary hashes are recorded. Binary identity is specific to this build, not cross-host bit reproducibility. This deck audits evidence without changing it.</desc>
