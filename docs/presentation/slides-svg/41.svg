<title id="title">A complete page is not a promise of current knowledge</title>
<desc id="desc">The sole Search profile is exact-attributes/1 with knowledge-attributes/1 extraction, contract 2.0.0. Canonical UTF-8 JSON requires kind and permits topic/label, all bounded strings. Search performs exact conjunction without normalization, embeddings or numerical scoring. A genuine empty result at a sufficient prefix differs from source lag. Query neither polls the current head nor advances the index. Cursors bind semantic query, principal/scope, source identity, snapshot and generation. Rebuild invalidates old-generation cursors explicitly; pending callers do not silently reset. The consumer carries independent Search and Relations snapshots, not a fictional cross-owner transaction. A stored completed intent can replay its historical result after current authorization is checked.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">06 / M5 · EXACT QUERY + FRESHNESS</text>
<text x="70" y="138.7" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#102B3F">A complete page is not a promise of current knowledge</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Search returns separate, inspectable claims about what it has actually indexed.</text>
<text x="88" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">CLAIM</text>
<text x="458" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">MEANING</text>
<text x="1038" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">WHY IT IS SEPARATE</text>
