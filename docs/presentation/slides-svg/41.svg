<text x="458" y="629.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Whether W equals H, with observation</text>
<text x="458" y="661.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">context</text>
<text x="1038" y="629.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">No query-side head poll or ingestion</text>
<text x="89" y="742.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">Exact conjunction: 1–3 distinct fields from kind / topic / label; equality only.</text>
