<title id="title">One actual Hive episode reaches private C1 and C2</title>
<desc id="desc">The verified schematics pin actual Hive 34b0fb32ab3806e5609fc89bb7535518a35e1aea. Native startup is python -m hive; the integration driver uses the actual create_app, default Supervisor, PeTTa and native authenticated Programs dispatch in real processes. ASGI TestClient is only the transport. The sibling fusion-episode plugin derives authority from trusted actor context and operator principal/swarm mapping; it does not expose arbitrary observations over the shared wire. The original fusion-inspect plugin and thirteen tests remain unchanged. The seven M2 cases cover completion, exact replay/restart, all four SIGKILL boundaries, live revocation and private result isolation. Generated observations and assumptions remain fixtures even when the caller and providers are real.</desc>
