<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">C3: a small, independent attention policy</title>
<desc id="desc">The reference policy is frozen in its identity. Bounds are 16 targets, 16 advance steps per call, eight contexts, 512 causes per context, 1024 commands per owner and feedback generation three. Capacities refuse without silent eviction of acknowledged commands. Stimulus saturation is min(amount, Smax-current); total context budget is enforced atomically. Successful replay is checked before logical clock CAS under live authorization. Causal deduplication is independent of request identity; changing a causal body conflicts. Fresh feedback follows the target&#x27;s current causal parent and next generation. metta-attention 3e1c8147 was inspected but not integrated because it couples STI/LTI/VLTI, wages and shared funds. C3 has no hidden dependency on AtomStorage, C1, C2, PLN or Hive.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / SHORT-TERM IMPORTANCE</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">C3: a small, independent attention policy</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">sti-additive-linear-decay/1 · integer STI · explicit logical time · persistent causal identity</text>
<rect x="72" y="250" width="464" height="331" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="304.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#315E9C">Stimulate</text>
<text x="94" y="353.07" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Add within per-target</text>
<text x="94" y="390.19" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">saturation. Refuse the whole</text>
<text x="94" y="427.31" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">change if the context</text>
<text x="94" y="464.43" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">budget would be exceeded.</text>
<rect x="568" y="250" width="464" height="331" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="590" y="304.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#007C78">Select</text>
<text x="590" y="353.07" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Rank positive eligible</text>
<text x="590" y="390.19" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">targets by descending STI,</text>
<text x="590" y="427.31" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">then the full canonical</text>
<text x="590" y="464.43" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">reference. Reads do not</text>
<text x="590" y="501.55" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">decay state.</text>
<rect x="1064" y="250" width="464" height="331" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="1086" y="304.3" font-family="DejaVu Sans" font-size="34" font-weight="700" fill="#315E9C">Advance</text>
<text x="1086" y="353.07" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Explicitly decay by logical</text>
<text x="1086" y="390.19" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">steps. Stored causal</text>
<text x="1086" y="427.31" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">generation survives decay,</text>
<text x="1086" y="464.43" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">new ingress and new step</text>
<text x="1086" y="501.55" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">IDs.</text>
<text x="77" y="655.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#102B3F">Default limits: 100 STI per target · 300 per context · decay 1 per logical step</text>
<text x="77" y="716.65" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Only authority and opaque-reference syntax are required; no Hive, storage or PLN runtime.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="797.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">This reference policy is implemented. ECAN, LTI, diffusion and new attention research are out of scope.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M3.1 / attention.py · fixture_attention.py</text>
