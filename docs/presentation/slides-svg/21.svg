<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">A small baseline, with the failure path included</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">One 62-byte fixture, one slice per binding. Bars share a zero baseline; this is not a benchmark.</text>
