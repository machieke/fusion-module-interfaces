<title id="title">Fresh verification exercises distinct layers</title>
<desc id="desc">Counts come from the committed M1.2 verification JSON, not a new test run for this deck. The 51 fixture tests are included in the full 90-test matrix. Clean upstream DeTTa passes 62 DA and 38 storage tests; the historical dirty checkout passed 40 storage tests because it included two local additions. The native baseline is 34 selected tests, not the full Hive suite. The new real-caller suite has 13 cases covering success/replay, three caller kill points, worker death, route backpressure, worker revocation and six negative conditions. All final run commands returned zero; native JUnit records no failures, errors or skips. Development failures and their corrections remain in the evidence directory. No new benchmark or integration run is implied by rebuilding the presentation.</desc>
