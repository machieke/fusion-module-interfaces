<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A small baseline, with the failure path included</title>
<desc id="desc">Values are read directly from the committed demo.json, not retyped as marketing claims. The in-process binding is about the service call only; both configurations launch real DA helpers and separate workers. End-to-end slices include failure injection and recovery: approximately 0.756 and 1.761 seconds. Each used 17 client calls with 6,550 request bytes and 5,731 response bytes. In-process counts are logical serialization sizes; subprocess counts are actual pipe bytes. Canonical DA fixture/result payloads were 1,027 and 1,284 bytes, but DA framing and worker-control traffic were not measured. Both runs ended with two atoms, one job, two acknowledged messages and no pending outbox. Zero observed acknowledged-data loss is bounded by this failure model and sample, not a general durability theorem or performance guarantee.</desc>
