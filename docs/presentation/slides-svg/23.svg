<text x="94" y="394.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">source/profile checks and</text>
<text x="94" y="429.96000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">remaining deadline</text>
