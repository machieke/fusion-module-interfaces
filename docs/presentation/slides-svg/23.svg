<text x="94" y="385.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Fusion commit/bundle; Hive</text>
<text x="94" y="419.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">and DeTTa via authorized</text>
<text x="94" y="454.45" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">SSH; public PeTTa and SWI</text>
<text x="94" y="489.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">commits.</text>
