<text x="590" y="339.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Create new artifacts</text>
<text x="590" y="385.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Python 3.12.12, SWI 10.1.14</text>
<text x="590" y="419.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">and Janus 1.5.3; locked</text>
<text x="590" y="454.45" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">packages; fresh native objects</text>
<text x="590" y="489.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">and venv.</text>
