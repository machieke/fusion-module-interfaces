<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">M1.2 remains a working, separate integration</title>
<desc id="desc">The M2 verifier explicitly compares the preserved source files against requested M1.2 evidence ancestor 4ee5cbe8b84689a5d2432530083738b263142f90. It reruns the original thirteen real native Hive tests, the selected native baseline, upstream DeTTa and the full conformance suite. ports.py grows new local protocols, while the preserved original wire schemas and bindings remain unchanged. All six built provider source trees are clean after testing, and supplied sibling sources remain unchanged. No ECAN, inference control, general PLN kernel, live migration or chain action is added.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">04 / REGRESSION AND SCOPE PRESERVATION</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">M1.2 remains a working, separate integration</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Private cognition is added alongside the original storage, messaging and execution path.</text>
<rect x="72" y="250" width="704" height="208" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="302.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">Original native operation</text>
<text x="94" y="348.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">fusion-inspect still stores bytes, shares a ref,</text>
<text x="94" y="383.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">delegates inspect_atom, recovers completion</text>
<text x="94" y="417.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">and acknowledges it.</text>
<rect x="800" y="250" width="728" height="208" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="822" y="302.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">New private operation</text>
<text x="822" y="348.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">fusion-episode records private events and revises</text>
<text x="822" y="383.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">eligible evidence. It constructs no mailbox,</text>
<text x="822" y="417.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">execution or chain port.</text>
<text x="88" y="521.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">PRESERVED SOURCE BOUNDARY</text>
