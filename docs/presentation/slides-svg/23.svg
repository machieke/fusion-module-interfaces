<text x="70" y="140.6" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#102B3F">M0 and M1 are complete. The next gate stays closed.</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">The architecture describes the next steps; this implementation stops before M2.</text>
