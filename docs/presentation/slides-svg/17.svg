<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Worker failure and backpressure preserve pending work</title>
<desc id="desc">The native worker-recovery test kills the existing worker after AtomStorage has committed the result and before execution terminal state/outbox commit. The test observes two atoms, one queued job and no outbox, then restarts and verifies one result. In the full-route test, a labelled fixture fills the dedicated reply route. Flush reports zero sent and one pending. The native operation refuses the unrelated delivery and does not record an accepted outcome. After fixture cleanup, flush and native completion succeed. A separate test revokes worker create authority after admission and observes an explicit UNAUTHORIZED failed completion without a result atom. Temporary input unavailability is exercised in the preserved M1.1 matrix; the new native representative provider-failure case is route backpressure. No cross-owner atomicity is claimed.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / RECOVERY · INDEPENDENT COMMITS</text>
<text x="70" y="137.75" font-family="DejaVu Sans" font-size="45" font-weight="700" fill="#102B3F">Worker failure and backpressure preserve pending work</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A result can survive worker death; a full route can delay completion without losing it.</text>
