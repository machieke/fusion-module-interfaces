<text x="558" y="652.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">OVERLOADED / retained outbox</text>
<text x="1028" y="652.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No silent acknowledged-work drops</text>
