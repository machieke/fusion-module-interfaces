<title id="title">Native revision reuses the guarded implementation</title>
<desc id="desc">Reachability is pinned at dd56f3f053ed90239de5377021a7d3b3fbf424ac; PLN at 4405956947c4b53c7ff01bd565aa3b114bc970a1; PeTTa at ae66fa8e41dcd5539d614706bd4e5cfb34f9608d. C2 loads the unchanged PLNAdapter.revise and its truth/support guards, injecting only a revision-specific native runner. The runtime profile is fusion-petta-swi-10.1.14-revision/1, with model trueagi-pln-stv-finite-k1/v1. The upstream historical 10.0.1 checks/locks were not weakened. Source and binary drift, missing binaries, invalid outputs and timeouts are refused. This is not a general PLN rule kernel or an AdmissionService/AtomSpace projection. C2 rechecks live authority and expected revision after computation before committing.</desc>
