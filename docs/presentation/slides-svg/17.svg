<text x="94" y="552.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#315E9C">Kill after result persistence</text>
<text x="94" y="597.77" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">The job remains queued while its atom is</text>
<text x="94" y="632.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">durable. Restart reuses the logical result and</text>
<text x="94" y="666.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">later publishes completion.</text>
<rect x="800" y="472" width="728" height="238" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="822" y="509.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#A86A15">NATIVE CALLER BACKPRESSURE</text>
<text x="822" y="552.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#A86A15">Full reply route</text>
<text x="822" y="597.77" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">The outbox remains pending. The caller refuses</text>
<text x="822" y="632.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">an unrelated delivery; once capacity returns, the</text>
<text x="822" y="666.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">known completion is accepted.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
