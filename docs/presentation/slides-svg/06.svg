<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: a catalogue, labelled links and the actual books</title>
<desc id="desc">The catalogue is a rebuildable projection of an AtomStorage-owned accepted commit feed. It indexes a single explicit exact-attribute profile; it is not an embedding engine or inference search. Relations owns acceptance and incidence separately from immutable payload storage. Setup writes the generated corpus through public ports and exits before actual authenticated native Hive lookup. The private request contains query attributes and a freshness barrier only. The test-only oracle is removed before consumer startup. At page size two, five roots require three Search pages. Fifteen requires edges connect them to three prerequisites, producing eight unique payloads. One new matching record later yields six roots and nine payloads. Public receipts show counts/status; full records remain private.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 5 OF 5</text>
<text x="70" y="139.65" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#102B3F">ELI16: a catalogue, labelled links and the actual books</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Ask the library for matching records, follow their links, then read the stored content.</text>
<rect x="72" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="94" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">SEARCH · CATALOGUE</text>
<text x="94" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Find matching records</text>
<text x="94" y="380.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Ask for exact attributes. The</text>
<text x="94" y="414.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">catalogue returns references</text>
<text x="94" y="449.45" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">and says how far it has</text>
<text x="94" y="484.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">indexed the accepted records.</text>
<rect x="568" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="590" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">RELATIONS · LINKS</text>
<text x="590" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Follow explicit</text>
<text x="590" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">structure</text>
<text x="590" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">A record may require three</text>
<text x="590" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">other records. Follow the</text>
<text x="590" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">labelled, ordered roles to</text>
<text x="590" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">discover their references.</text>
<rect x="1064" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="1086" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">ATOMSTORAGE · BOOKS</text>
<text x="1086" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Retrieve the actual</text>
<text x="1086" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">bytes</text>
<text x="1086" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Read the discovered</text>
<text x="1086" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">references through the</text>
<text x="1086" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">storage contract. The</text>
<text x="1086" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">consumer was never given an</text>
<text x="1086" y="558.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">answer list.</text>
<rect x="72" y="650" width="1456" height="99" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="94" y="695.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#007C78">Observed in real Hive</text>
<text x="94" y="733.95" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#536775">5 matching records → 15 relations → 8 payloads. Append, catch up, rebuild, restart and replace Search.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="799.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">“No match in this indexed prefix” and “the index is too far behind” are different answers.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M5 / M5 · actual native fusion-lookup</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">06 / 64</text>
