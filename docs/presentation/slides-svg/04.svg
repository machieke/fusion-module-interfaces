<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: finishing the job and settling its receipts</title>
<desc id="desc">Closure means accounting for recorded effects, not guaranteeing global completion. Nine fixture methods, five real-provider methods, sixteen direct SIGKILL cases and seven native Hive cases (four with kills) support the new behavior. The 33-event episode uses real DeTTa/native PLN with generated observations. A report can be durably processed without a numerical truth value. Feedback resolution never newly applies eligible feedback: it returns an existing receipt, creates a no-credit retirement if stale or expired, or stays pending. C4 exposes progress separately from immutable execution counters. New profiles require fresh journals; old M3 pending stores are not migrated or repaired.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 3 OF 3</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">ELI16: finishing the job and settling its receipts</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A notebook entry, a calculation and a reward can finish at different times.</text>
<rect x="72" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="94" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">C1 + RELAY</text>
<text x="94" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">The report was</text>
<text x="94" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">processed</text>
<text x="94" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">The notebook gets a delivery</text>
<text x="94" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">receipt even when a report</text>
<text x="94" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">cannot change a number.</text>
<text x="94" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Contrary evidence stays in the</text>
<text x="94" y="558.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">story.</text>
<rect x="568" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="590" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">C3 · ATTENTION</text>
<text x="590" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">The reward has one</text>
<text x="590" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">outcome</text>
<text x="590" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Ask the priority-list owner:</text>
<text x="590" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">already credited, retired</text>
<text x="590" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">without credit, or still pending.</text>
<text x="590" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">A lost reply never earns a</text>
<text x="590" y="558.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">second reward.</text>
<rect x="1064" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#A86A15"/>
<text x="1086" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#A86A15">C4 + HIVE</text>
<text x="1086" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#A86A15">The receipt tells both</text>
<text x="1086" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#A86A15">stories</text>
<text x="1086" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Show the original work result</text>
<text x="1086" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">and the later cleanup progress</text>
<text x="1086" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">separately. Cleanup does not</text>
<text x="1086" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">buy another attempt.</text>
<rect x="72" y="650" width="1456" height="99" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="94" y="695.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#007C78">Observed</text>
<text x="94" y="733.95" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#536775">33 observations drained; 20 new process-kill cases; no new formula calls during reconciliation.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="797.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">M3.1 settles recorded effects. It does not extend the deadline, change the past or start new thinking.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M3.1 / M3.1 delivery closure · owner receipts</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">04 / 44</text>
</svg>
