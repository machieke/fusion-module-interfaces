<text x="94" y="554.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">C4 keeps a separate closure journal</text>
<text x="94" y="599.38" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">1–16 resolutions per call · 128 commands per step</text>
<text x="94" y="632.66" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Original execution, spent budget and deadline stay fixed.</text>
<text x="94" y="665.94" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Reconciliation makes zero new native formula calls.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="798.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">Applied before a lost reply → recover once. Retired first → delayed delivery cannot award credit.</text>
