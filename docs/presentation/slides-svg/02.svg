<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: a notebook, an evidence ledger, a calculator</title>
<desc id="desc">ELI16 means explain the idea to a technically curious sixteen-year-old without assuming distributed-systems or PLN vocabulary. The notebook is C1: what happened, in what order and with what provenance. The evidence ledger is C2: what was admitted, what contributes to the current aggregate and what remains an alternative. The calculator is the narrow RevisionMath dependency; it does not decide what to think about. The runtime is real, while the observations and independence declarations in the demonstration are generated fixtures. We killed actual processes and recovered from local files. That supports a local restart claim, not power-loss or distributed failover. Benefits are auditable history, duplicate-safe contributions and explicit provider choices.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 1 OF 2</text>
<text x="70" y="142.5" font-family="DejaVu Sans" font-size="50" font-weight="700" fill="#102B3F">ELI16: a notebook, an evidence ledger, a calculator</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">An agent needs to remember what happened without treating every report as a new fact.</text>
<rect x="72" y="250" width="464" height="344" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="94" y="287.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">C1 · THE NOTEBOOK</text>
<text x="94" y="333.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">Keep the original story</text>
<text x="94" y="379.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Record events in order,</text>
<text x="94" y="414.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">including who they came from.</text>
<text x="94" y="448.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Replaying the same event</text>
<text x="94" y="483.28999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">does not add a new entry.</text>
<rect x="568" y="250" width="464" height="344" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="590" y="287.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">C2 · THE EVIDENCE LEDGER</text>
<text x="590" y="333.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">Keep disagreement</text>
<text x="590" y="374.35999999999996" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">visible</text>
<text x="590" y="420.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Track which observations</text>
<text x="590" y="455.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">support a belief. A copied</text>
<text x="590" y="489.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">report does not become</text>
<text x="590" y="524.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">independent evidence.</text>
<rect x="1064" y="250" width="464" height="344" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="1086" y="287.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">PINNED PLN · THE CALCULATOR</text>
<text x="1086" y="333.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">Update only when</text>
<text x="1086" y="374.35999999999996" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">justified</text>
<text x="1086" y="420.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Use the existing formula for an</text>
<text x="1086" y="455.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">explicitly allowed pair. Save</text>
<text x="1086" y="489.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">the decision and the evidence</text>
<text x="1086" y="524.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">behind it.</text>
<rect x="72" y="610" width="704" height="139" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="657.65" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#315E9C">What works</text>
<text x="94" y="698.41" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Real Hive + local storage + native revision survive</text>
<text x="94" y="727.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">tested process restarts.</text>
<rect x="800" y="610" width="728" height="139" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="822" y="657.65" font-family="DejaVu Sans" font-size="27" font-weight="700" fill="#A86A15">What this does not prove</text>
<text x="822" y="698.41" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">That reports are true, sources are independent, or the</text>
<text x="822" y="727.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">system is production-ready.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="798.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">Why it matters: we can inspect, retry and replace parts without silently changing their meaning.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M2 / m2-evidence.md · architecture.md</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">02 / 38</text>
