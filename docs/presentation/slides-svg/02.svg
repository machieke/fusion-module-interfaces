<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The architecture separates three commitments</title>
<desc id="desc">The thesis remains behavior, authority and evidence. A matching method name is insufficient: profiles define semantics and guarantees. Only the state owner may write its state. Receipts describe specific facts rather than one universal success. The real Hive operator action generates a non-sensitive sample, stores it through AtomStorage, sends its reference to a labelled fixture counterparty, submits inspect_atom, recovers completion, records its accepted outcome and acknowledges delivery. Chain submission is not part of this M1.2 path.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">01 / HELICOPTER VIEW</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">The architecture separates three commitments</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A function boundary, an authority boundary, and an evidence boundary.</text>
<rect x="72" y="255" width="464" height="330" rx="15" fill="#FFFFFF"/>
<text x="98" y="326.55" font-family="DejaVu Sans Mono" font-size="49" font-weight="400" fill="#007C78">01</text>
<text x="98" y="388.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">Replace behavior</text>
<text x="98" y="428.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">safely</text>
<text x="98" y="477.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Select a versioned contract</text>
<text x="98" y="510.97999999999996" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">and semantic profile. Keep the</text>
<text x="98" y="544.26" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">consumer independent of the</text>
<text x="98" y="577.5400000000001" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">provider.</text>
<rect x="568" y="255" width="464" height="330" rx="15" fill="#FFFFFF"/>
<text x="594" y="326.55" font-family="DejaVu Sans Mono" font-size="49" font-weight="400" fill="#007C78">02</text>
<text x="594" y="388.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">Write through the</text>
<text x="594" y="428.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">owner</text>
<text x="594" y="477.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Episodes, beliefs, attention</text>
<text x="594" y="510.97999999999996" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">and jobs each have a single</text>
<text x="594" y="544.26" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">logical authority for their</text>
<text x="594" y="577.5400000000001" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">state.</text>
<rect x="1064" y="255" width="464" height="330" rx="15" fill="#FFFFFF"/>
<text x="1090" y="326.55" font-family="DejaVu Sans Mono" font-size="49" font-weight="400" fill="#007C78">03</text>
<text x="1090" y="388.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">Name what was</text>
<text x="1090" y="428.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">observed</text>
<text x="1090" y="477.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Storage, delivery, execution</text>
<text x="1090" y="510.97999999999996" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">and finality carry separate</text>
<text x="1090" y="544.26" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">receipts and explicit limits.</text>
<text x="75" y="658.5" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#102B3F">One real Hive operation exercises these boundaries</text>
