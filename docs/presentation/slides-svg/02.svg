<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: remember, weigh evidence, do the calculation</title>
<desc id="desc">ELI16 assumes a technically curious sixteen-year-old. The analogy explains responsibilities, not an additional experiment. C1 records occurrences and provenance. C2 distinguishes admission from numerical aggregation and retains disagreement. The pure providers reuse guarded Truth_Revision and one grounded Truth_Deduction rule. Their outputs remain model-specific heuristics, not proof of external truth or source independence. Derived conclusions inherit evidence roots and ancestry and add no observation or evidence count. Generated observations and operator assumptions remain fixtures, even when they travel through real runtimes.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 1 OF 3</text>
<text x="70" y="140.6" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#102B3F">ELI16: remember, weigh evidence, do the calculation</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Think of a student investigating a question with a notebook, evidence ledger and calculator.</text>
<rect x="72" y="252" width="464" height="380" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="94" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">C1 · NOTEBOOK</text>
<text x="94" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Keep the original story</text>
<text x="94" y="380.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Record what happened and</text>
<text x="94" y="414.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">where each report came from.</text>
<text x="94" y="449.45" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Keep contrary observations;</text>
<text x="94" y="484.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">replay does not add another</text>
<text x="94" y="518.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">event.</text>
<rect x="568" y="252" width="464" height="380" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="590" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">C2 · EVIDENCE LEDGER</text>
<text x="590" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Know what supports a</text>
<text x="590" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">belief</text>
<text x="590" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">A copy is still the same source.</text>
<text x="590" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">A conclusion keeps its</text>
<text x="590" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">parents; it does not become a</text>
<text x="590" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">fresh observation.</text>
<rect x="1064" y="252" width="464" height="380" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="1086" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">PLN · CALCULATOR</text>
<text x="1086" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Apply a guarded</text>
<text x="1086" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">formula</text>
<text x="1086" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Use the existing pinned</text>
<text x="1086" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">mathematics on exact inputs.</text>
<text x="1086" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">C2 checks and saves the</text>
<text x="1086" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">result; the calculator owns no</text>
<text x="1086" y="558.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">beliefs.</text>
<rect x="72" y="650" width="1456" height="99" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="695.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#315E9C">What this gives us</text>
<text x="94" y="733.95" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#536775">An inspectable trail from original observations to admitted conclusions.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="799.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">A repeated message, a new conclusion and an independent observation mean different things.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M3.1 / M2 preserved · M3 derived admission</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">02 / 44</text>
</svg>
