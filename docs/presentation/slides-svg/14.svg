<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Function dependencies: discover → traverse → retrieve</title>
<desc id="desc">LookupConsumer depends only on ExactSearch, PagedRelations, AtomStorage and current private authority. Numbered calls show discovery, one-hop traversal including reverse-incidence verification, and payload retrieval. The caller owns its journal and retained full result. Search owns derived rows, checkpoint and generation and reads only declared source ports; it never opens another owner&#x27;s database. Relations owns accepted structures, replay keys and incidence; immutable relation payload creation commits before relation acceptance. AtomStorage owns immutable envelopes plus its contiguous scoped accepted feed, above unchanged opaque DeTTa. Head/readCommits/get dependencies belong to maintenance, not query. Neither lookup nor these new owners invokes C1/C2, attention, inference or chain. Existing caller intents retain their selected provider; fresh replacement uses a new request and rebuilt derived store.</desc>
