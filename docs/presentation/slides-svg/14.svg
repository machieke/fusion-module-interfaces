<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">A receipt proves one fact at one boundary</title>
<desc id="desc">Avoid turning this grid into a linear distributed transaction. A result can be durable before a chain commitment exists; messaging can be delayed while result retrieval already works. Payload persistence is qualified by its local durability scope. Mailbox acceptance is different from recipient acknowledgement. Execution completion is different from whether its outbox was delivered. Chain submission yields a deploy ID, inclusion yields a block observation and effect finality comes from the specific inspected endpoint. A finalized digest does not prove a payload will remain available, nor does any of these receipts establish belief confidence. This separation is central to both interfaces and reporting.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / RUNNING INTEGRATION · EVIDENCE MODEL</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">A receipt proves one fact at one boundary</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">These observations are independent. They are not one universal success state.</text>
