<title id="title">Specified cognitive contracts carry test obligations</title>
<desc id="desc">Episode expected_sequence and belief expected_revision make concurrent updates explicit. Replayed evidence must not add weight; derived cycles and overlapping roots cannot manufacture independent support. Reachability&#x27;s guarded trueagi-pln-stv-finite-k1/v1 implementation is a candidate for review, not a selected universal model. metta-attention exposes STI/LTI/VLTI and direct setters, so it cannot be silently advertised as the proposed STI-only policy. Attention requires a declared budget, saturation, conservation or nonconservation, decay and tie-breaking behavior. Inference control must bound feedback generations and work, and define durable checkpoint semantics before advertising crash safety. These obligations belong to future milestones; new cognitive services remain absent.</desc>
