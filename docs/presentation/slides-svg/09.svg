<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Separate owners now have separate durable commits</title>
<desc id="desc">This replaces the old M1 shared-journal drawing. M1.1 split atom metadata, messages and execution into separately committed owner stores and declared the dependencies actually exercised by the worker. Execution&#x27;s own terminal state and outbox are atomic with each other, not with atom persistence or mailbox acceptance. Wire replay metadata is colocated with execution, while cross-owner operations have owner-local replay. M1.2 adds only a minimal caller boundary receipt, not episodes or a new journal framework. It serializes one caller journal and permits one unfinished intent per dedicated route. All observations concern persistent local files and process restart.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">02 / OWNERSHIP · M1.1 PRESERVED</text>
<text x="70" y="139.65" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#102B3F">Separate owners now have separate durable commits</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Result atoms, execution state, mailbox acceptance and caller acceptance do not share a transaction.</text>
