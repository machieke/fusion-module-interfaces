<text x="590" y="403.64000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">result persistence already</text>
<text x="590" y="434.36" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">committed.</text>
