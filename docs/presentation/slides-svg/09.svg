<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">State ownership survives co-location</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A shared database is a deployment choice. Its tables still have different writers.</text>
<text x="75" y="264.0" font-family="DejaVu Sans" font-size="20" font-weight="700" fill="#315E9C">M1: TRUSTED LOCAL SERVICE</text>
