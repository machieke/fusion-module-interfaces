<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">State ownership survives co-location</title>
<desc id="desc">M1 uses one SQLite journal to keep the example small. That journal stores several logically owned categories: atom metadata, messaging inbox state, execution jobs and outbox, plus replay records. Public dispatch only exposes declared operations, never raw SQL, worker controls or setters for another owner. Shared storage therefore does not erase responsibility boundaries. DA payloads and erasure shares live in actual DeTTa FileStorage outside SQLite. In future work, private episode history remains client-side, and truth or attention can change only through the relevant owner. This is logical ownership, not a claim of multi-tenant process isolation against the same OS user.</desc>
