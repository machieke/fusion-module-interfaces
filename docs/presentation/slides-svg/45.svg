<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="796.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">This is bounded reference coverage, not full Omega completeness. Line/branch coverage: NOT_MEASURED.</text>
