<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Coverage has three denominators</title>
<desc id="desc">The ledger explicitly separates module, operation and behavioral axes. The fifteen-family denominator is the reference inventory, not a complete product requirements set. Nine new operations are assertRelation/getRelation/outgoing/incoming, Search.query, AtomStorage.head/readCommits and Search.catchUp/beginRebuild. Four inherited dependencies create/get/getMany/availability bring the exercised M5 slice to thirteen. Eighteen behavioral groups comprise twelve brief scenarios plus six crash boundaries; thirteen kill instances instantiate those boundaries. No line or branch coverage percentage is measured. The new fixture, real-provider and native methods overlap repeated legacy runs and must not be summed into a false total. Human maintainers remain UNASSIGNED.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">07 / M5 · CAPABILITY LEDGER</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Coverage has three denominators</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Module representation, exercised operations and behavioral coverage answer different questions.</text>
<rect x="72" y="250" width="464" height="444" rx="14" fill="#FFFFFF" stroke="#007C78"/>
<text x="96" y="336.75" font-family="DejaVu Sans" font-size="65" font-weight="700" fill="#007C78">15 / 15</text>
<text x="96" y="407.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">Module families</text>
<text x="96" y="472.55" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Up from 13. All bounded</text>
<text x="96" y="509.67" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">reference families now have</text>
<text x="96" y="546.79" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">a represented</text>
<text x="96" y="583.91" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">implementation.</text>
<rect x="568" y="250" width="464" height="444" rx="14" fill="#FFFFFF" stroke="#007C78"/>
<text x="592" y="336.75" font-family="DejaVu Sans" font-size="65" font-weight="700" fill="#007C78">9 / 9</text>
<text x="592" y="407.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">New operations</text>
<text x="592" y="472.55" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">4 Relations + query + 2</text>
<text x="592" y="509.67" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">feed + 2 maintenance. With</text>
<text x="592" y="546.79" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">inherited storage: 13 / 13 in</text>
<text x="592" y="583.91" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">this slice.</text>
