<text x="1088" y="336.75" font-family="DejaVu Sans" font-size="65" font-weight="700" fill="#007C78">18 / 18</text>
<text x="1088" y="407.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#102B3F">Behavioral groups</text>
<text x="1088" y="472.55" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">12 required scenario groups</text>
<text x="1088" y="509.67" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">+ 6 crash-boundary groups.</text>
<text x="1088" y="546.79" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Separate from test-method</text>
