<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Cognitive responsibilities: four separate roles</title>
<desc id="desc">C3 implements the bounded sti-additive-linear-decay/1 reference policy, not ECAN or the inspected metta-attention implementation. C4 owns selection and physical attempt reservations; it depends on AtomStorage, Attention, DerivedBeliefRevision and PrivateAuthority. It does not call PLNKernel directly. C2 depends on AtomStorage, C1 readEvidence, RevisionMath, PLNKernel and PrivateAuthority. The pure kernel owns no belief, agenda or attention state. M2 revision-only local v2 remains selectable; derived private C2 is a fresh local v3 profile.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">01 / RESPONSIBILITY ATLAS · 2 OF 3</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Cognitive responsibilities: four separate roles</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Attention, belief admission, pure mathematics and work coordination remain separate.</text>
<text x="88" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">MODULE</text>
<text x="418" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">FUNCTION / PRIMARY OPERATIONS</text>
<text x="1048" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">OWNED STATE / BOUNDARY</text>
<rect x="72" y="277" width="1456" height="104" rx="6" fill="#FFFFFF"/>
<text x="88" y="316.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">Belief revision C2</text>
<text x="418" y="316.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">submitEvidence · readBelief</text>
<text x="418" y="347.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">submitDerivation · readDerivation</text>
<text x="1048" y="316.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Supports, snapshots, attempts</text>
<text x="1048" y="347.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Only C2 commits belief changes</text>
<rect x="72" y="386" width="1456" height="104" rx="6" fill="#FFFFFF"/>
<text x="88" y="425.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">PLN kernel</text>
<text x="418" y="425.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Apply one grounded rule to exact premises</text>
<text x="418" y="456.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">profiles · applyRule</text>
<text x="1048" y="425.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No mutable domain state</text>
<text x="1048" y="456.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Pure native proposal</text>
<rect x="72" y="495" width="1456" height="104" rx="6" fill="#FFFFFF"/>
<text x="88" y="534.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">Attention C3</text>
<text x="418" y="534.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">select · advance · submitStimulus</text>
<text x="418" y="565.52" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">submitFeedback · resolveFeedback</text>
<text x="1048" y="534.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">STI, clock, causal receipts / retirement</text>
<text x="1048" y="565.52" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No cognition dependency</text>
<rect x="72" y="604" width="1456" height="104" rx="6" fill="#FFFFFF"/>
<text x="88" y="643.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">Inference control C4</text>
<text x="418" y="643.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Run one immutable workset</text>
<text x="418" y="674.52" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">step · readProgress · reconcile</text>
<text x="1048" y="643.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Selection, budgets, closure progress</text>
<text x="1048" y="674.52" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No truth or attention ownership</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="798.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">C4 calls C2 for admission. C2 invokes the kernel, then checks authority and commits its decision.</text>
