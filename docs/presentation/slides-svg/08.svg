<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Function dependencies: admission, work and delivery</title>
<desc id="desc">Demo setup resolves suitable descriptors, then Peer invokes the configured binding. The dashed offers arrow supplies descriptor data to the resolver. Each service invocation validates the wire envelope and checks the current local policy before the explicit dispatch allowlist. This diagram focuses on delegated execution; direct store and messaging calls pass through the same authorization boundary. Worker execution calls the atom owner to read inputs and create a persisted result. Completion goes through a durable outbox into the message owner&#x27;s inbox; poll/ack are recipient-owned operations. The chain adapter is a separate optional consumer of one approved result digest. It is not on the mandatory storage or execution path. Scope/method checks also apply to worker reads and completion delivery. The static resolver does not grant permissions.</desc>
