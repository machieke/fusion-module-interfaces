<title id="title">Exact source identity includes the rebaseline</title>
<desc id="desc">Full tested Fusion commit: bb22ef5e28b089b80132b40bcf5a1bbfc38b065b. Evidence snapshot: 4ee5cbe8b84689a5d2432530083738b263142f90. Hive 34b0fb32ab3806e5609fc89bb7535518a35e1aea; clean DeTTa 272888f264dd2dde18b574cabb53c266b0dac2ec; PeTTa ae66fa8e41dcd5539d614706bd4e5cfb34f9608d; SWI 69775434c8226897626b226aefcc8266499f1e2e; schematics 4af00db4e395375484dd48d0b9068a59afcf01f8. The native build used Fusion 1a627b0; only verifier import ordering changed before bb22ef5 verification. The final evidence descendant changes no implementation. Rust/Cargo 1.88.0, CMake 3.16.3, GCC 9.4.0 and uv 0.10.7 are recorded. Original supplied siblings remain unchanged. Historical F1R3 used a dirty tree at 9ec1096e1077 plus an untracked input; that historical source state is not distributed by the new recipe. The selected Hive revision is the one named by the supplied schematics, not a silent choice of remote HEAD.</desc>
