<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Authorization, replay and profiles remain live</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Cached success does not bypass current authority, and compatibility is never silently widened.</text>
