<title id="title">Reproducibility connects source, build and observed result</title>
<desc id="desc">Requested ancestor f0cee248294a1fce42913782390e6c084025c67e; actual starting descendant 926882afb9ab9c7288bf663f96f9e1ca63dd8520; tested source 1af39794649d0ca95cd729c64868202368da1ec4; evidence-only descendant c4498ce3047f1283d3a4a3ae3d09b713e7dcf312. Build_m3.py wraps the byte-identical M2 recipe and adds the separately selected deduction configuration. All exercised upstream sources were clean at their pins. Historical M2 SWI binary identity differs from the fresh M3 build and is not silently equated. Exact hashes, versions, command arguments, durations and JUnit results are committed. Provider environment files can contain local configuration and are deliberately excluded from published evidence. This deck hashes its evidence inputs and audits the archive without modifying it.</desc>
