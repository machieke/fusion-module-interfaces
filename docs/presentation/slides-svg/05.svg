<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">ELI16: approve a fingerprint, then check the receipt</title>
<desc id="desc">The sealed-envelope analogy describes durable signed-intent replay. M4 uses the real native fusion-inspect operation and a separate fusion-commitment action, with generated shareable input and a labelled fixture counterparty. Operator approval binds exact result reference/digest, actor, expiry, chain/genesis/profile, signer and operation. The same stored signed request survives caller/adapter kills, including a lost response after real finality. A separate reader verifies DA bytes and the chain tuple without opening a caller journal or signing key. The chain records a commitment; it neither executes PLN nor certifies off-chain reasoning. This is one real local validator, not decentralized security or a production network.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">EXECUTIVE SUMMARY · 4 OF 4</text>
<text x="70" y="141.55" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#102B3F">ELI16: approve a fingerprint, then check the receipt</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Imagine signing a sealed envelope containing the fingerprint of one shareable result.</text>
<rect x="72" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="94" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">1 · APPROVE</text>
<text x="94" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Name the exact result</text>
<text x="94" y="380.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Hive finishes a generated task.</text>
<text x="94" y="414.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">The operator approves that</text>
<text x="94" y="449.45" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">result, its destination and who</text>
<text x="94" y="484.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">may sign it.</text>
<rect x="568" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#A86A15"/>
<text x="590" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#A86A15">2 · SAVE, THEN SEND</text>
<text x="590" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#A86A15">Keep the same</text>
<text x="590" y="374.13" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#A86A15">envelope</text>
<text x="590" y="420.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Save the signed request</text>
<text x="590" y="454.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">before sending. After a crash,</text>
<text x="590" y="489.13" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">retry those same bytes; a lost</text>
<text x="590" y="523.69" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">reply does not mean a new</text>
<text x="590" y="558.25" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">request.</text>
<rect x="1064" y="252" width="464" height="390" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="1086" y="289.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">3 · VERIFY</text>
<text x="1086" y="334.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Read what was stored</text>
<text x="1086" y="380.33" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Check the fingerprint in the</text>
<text x="1086" y="414.89" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">block’s resulting state and the</text>
<text x="1086" y="449.45" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">matching deployment’s</text>
<text x="1086" y="484.01" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">finalized effect. Repeat after</text>
<text x="1086" y="518.57" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">restart.</text>
<rect x="72" y="650" width="1456" height="99" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="94" y="695.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#007C78">Private notebooks stay private</text>
<text x="94" y="733.95" font-family="DejaVu Sans" font-size="21" font-weight="400" fill="#536775">Only the approved generated workflow is eligible. Episodes, beliefs and their identifying hashes stay off-chain.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="798.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">A stored fingerprint identifies the approved result. It does not establish that the reasoning is true.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M4 / M4 · native Hive → isolated F1R3node</text>
<text x="1410" y="868.95" font-family="DejaVu Sans Mono" font-size="21" font-weight="400" fill="#536775">05 / 52</text>
</svg>
