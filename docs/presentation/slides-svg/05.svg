<text x="1048" y="317.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Belief + evidence ledger</text>
<text x="1048" y="349.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">No agenda or attention writes</text>
