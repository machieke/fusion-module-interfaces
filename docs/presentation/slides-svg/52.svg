<title id="title">Source, build and outcome remain independently traceable</title>
<desc id="desc">Requested ancestor 05b1c52cfa6ced6e263700753e82ad6038a3b0dd; actual start 4093301ea6b34bb8de487a4e4d9aae8a9ee6e61d; tested bfb0ec8856c932dc2bcbc05b8949c957da8d72cd; evidence-only 3dc6c1146601a0d0aa8785e61884970ec84a57c6. M5 implementation commits 0cb61d5, 9b0ed35 and bfb0ec8 precede the evidence commit. The native provider recipe recorded 4093301 because build began before implementation, but its recipe, pins and Rust adapter bytes remained identical at the tested source. Plugins loaded from clean bfb0ec8. The existing M4 Python lock was installed before the final legacy chain run. The pinned M4 node binary was reused with fresh isolated state/genesis. Earlier incorrect test DTO assumption, duplicate PYTHONPATH and missing cryptography dependency were fixed and recorded; intermediate PARTIAL does not count toward final gates. Source/build reproducibility is not cross-host bit reproducibility or an empty-cache claim.</desc>
