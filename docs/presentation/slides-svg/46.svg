<text x="413" y="652.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Power loss, distributed failover, empty caches</text>
<text x="413" y="683.52" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Live migration, public networks, new chain work</text>
<text x="1083" y="652.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No claims for these scenarios;</text>
