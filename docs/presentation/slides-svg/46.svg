<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Real providers, fixtures and unrun work stay distinct</title>
<desc id="desc">Generated private records and a test-only oracle do not become real user knowledge because real providers store them. The oracle is removed before the consumer runs and never supplies answer references. Hive authentication and Programs dispatch, local DeTTa and SQLite journals are real. Alternate atomic-file providers and local grants remain fixtures. The required final M5 missing-prerequisite, executed-failure and observation-timeout arrays are separately empty. A negative verifier test deliberately confirms BLOCKED/NOT_RUN classification without fixture fallback. Earlier development failures remain archived and do not count as final passes. Historical dirty M1 chain source reproduction remains blocked; the clean pinned M4 chain is separately verified and rerun in M5.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">07 / EVIDENCE CLASSIFICATION</text>
<text x="70" y="140.6" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#102B3F">Real providers, fixtures and unrun work stay distinct</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">All required M5 gates pass; each claim retains its actual provider and source label.</text>
<text x="88" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">CLASSIFICATION</text>
<text x="413" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">M5 EVIDENCE</text>
<text x="1083" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">MEANING</text>
