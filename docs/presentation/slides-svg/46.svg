<text x="413" y="540.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No required M5 prerequisite</text>
<text x="413" y="571.52" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Historical dirty M1 chain source unavailable</text>
