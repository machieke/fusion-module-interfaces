<text x="413" y="316.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Authenticated native Hive / PeTTa · DeTTa</text>
<text x="413" y="347.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">SQLite AtomStorage, Relations and Search</text>
<text x="1083" y="316.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Actual dispatch, persistence,</text>
<text x="1083" y="347.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">discovery and restart</text>
<rect x="72" y="389" width="1456" height="107" rx="6" fill="#FFFFFF"/>
<text x="88" y="428.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">FIXTURES</text>
<text x="413" y="428.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Generated corpus / oracle / local policy</text>
<text x="413" y="459.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Independent atomic-file providers; injected faults</text>
<text x="1083" y="428.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Controlled inputs and substitutions;</text>
<text x="1083" y="459.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">not production data or services</text>
<rect x="72" y="501" width="1456" height="107" rx="6" fill="#FFFFFF"/>
