<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Approval freezes the result and its destination</title>
<desc id="desc">The new profile is f1r3-generated-post-state/2; provider f1r3-local; interface 1.0.0; implementation 0.4.0. Approval binds the exact generated operation to one native principal/swarm, scope, result, expiry, chain and signer. Chain identity is not an RPC URL. The adapter persists canonical copies of approval and binding rather than retaining nested aliases. A negative regression on 1219bb5 demonstrated that a frozen dataclass alone allowed nested mutation; 55ed540 fixes it and passes the full rerun. Current authority is checked for accepted/replayed work and before submission. Wrong result, private scope, changed profile/genesis, malformed receipt or revoked authority fails explicitly. Only this generated shareable inspect workflow is eligible; there is no generic private-state publishing service.</desc>
