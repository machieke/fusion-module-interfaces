<text x="568" y="347.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">may need ack</text>
<text x="1018" y="316.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Acknowledge same result, then approve</text>
