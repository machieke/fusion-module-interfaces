<text x="568" y="424.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Exact signed bytes and timestamp</text>
<text x="1018" y="424.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Replay with signing key unavailable</text>
