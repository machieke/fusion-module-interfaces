<title id="title">Six receipts describe six different facts</title>
<desc id="desc">These facts are independent. A result atom can persist while the job is still queued after worker death. A succeeded job may have an unsent outbox when a reply route is full. A caller may have recorded its accepted outcome while acknowledgement is still pending. The plugin commits its outcome before acknowledgement to deduplicate that gap, and rechecks live authorization before returning it on replay. A failed worker completion is verified, recorded and acknowledged as an error, never transformed into empty memory or successful inspection. There is no exactly-once display or physical-execution guarantee. The original acceptance receipt in the trace remains queued/not-observed because it describes admission, not the later outcome.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / NATIVE INTEGRATION · COMPLETION SEMANTICS</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Six receipts describe six different facts</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A pending native receipt can be reconciled; it is not a Hive goal or a claim of completed work.</text>
<rect x="72" y="250" width="464" height="221" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="94" y="287.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">1 · INPUT PERSISTENCE</text>
<text x="94" y="329.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#007C78">Bytes have a scoped ref</text>
<text x="94" y="371.64000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Real DeTTa receipt; local</text>
<text x="94" y="402.36000000000007" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">files/process restart.</text>
<rect x="568" y="250" width="464" height="221" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="590" y="287.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">2 · JOB ACCEPTANCE</text>
<text x="590" y="329.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#315E9C">Work is durably queued</text>
<text x="590" y="371.64000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">No claim yet about execution or</text>
<text x="590" y="402.36000000000007" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">reply delivery.</text>
<rect x="1064" y="250" width="464" height="221" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="1086" y="287.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">3 · RESULT + TERMINAL</text>
<text x="1086" y="329.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#315E9C">Execution has an outcome</text>
<text x="1086" y="371.64000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Atom result first; job</text>
<text x="1086" y="402.36000000000007" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">terminal/outbox commit second.</text>
<rect x="72" y="501" width="464" height="221" rx="13" fill="#FFFFFF" stroke="#315E9C"/>
<text x="94" y="538.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#315E9C">4 · MAILBOX ACCEPTANCE</text>
<text x="94" y="580.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#315E9C">Completion is retained</text>
<text x="94" y="622.64" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Poll can repeat until the recipient</text>
<text x="94" y="653.36" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">acknowledges.</text>
<rect x="568" y="501" width="464" height="221" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="590" y="538.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">5 · CALLER ACCEPTANCE</text>
<text x="590" y="580.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#007C78">One outcome is recorded</text>
<text x="590" y="622.64" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Known job, correlation and result</text>
<text x="590" y="653.36" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">bytes verified.</text>
<rect x="1064" y="501" width="464" height="221" rx="13" fill="#FFFFFF" stroke="#007C78"/>
<text x="1086" y="538.2" font-family="DejaVu Sans" font-size="16" font-weight="700" fill="#007C78">6 · ACKNOWLEDGEMENT</text>
<text x="1086" y="580.6" font-family="DejaVu Sans" font-size="28" font-weight="700" fill="#007C78">Delivery is acknowledged</text>
<text x="1086" y="622.64" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Retry reuses the same key if the</text>
<text x="1086" y="653.36" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">ack response is lost.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="796.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">Native done = verified outcome + successful acknowledgement. Terminal failure stays an explicit error.</text>
