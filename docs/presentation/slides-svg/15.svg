<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="797.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">One logical result; physical computation may repeat. Tested failure model: same-host process death.</text>
