<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Crash recovery is a replay protocol</title>
<desc id="desc">The three tested fault boundaries are acceptance committed before a response, DA result persisted before the completion transaction, and completion committed before dispatch. The demo itself performs the latter two worker kills; the contract suite also tests the acceptance-reply boundary. Deterministic storage coordinates and semantic deduplication let an attempt replay without a second logical result. A DA write before journal commit can leave an unreferenced artifact: there is no cross-store atomicity claim. Result metadata, job completion and outbox intent commit together in SQLite; inbox delivery and outbox completion also commit together. A full or revoked reply route keeps completion pending. These tests cover SIGKILL on the same host, not power loss, disk loss, Byzantine behavior or exactly-once physical computation.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / RUNNING INTEGRATION · DURABILITY</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Crash recovery is a replay protocol</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">SQLite and DA do not share an atomic commit. The gap is handled explicitly.</text>
