<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Thirteen process kills exercise separate commit boundaries</title>
<desc id="desc">Nine direct process-kill cases plus four native cases total thirteen deliberately placed M5 SIGKILL scenarios. Test hooks pause at known boundaries with SIGSTOP, then the harness kills the actual process; fixtures position the fault but recovery uses real persisted files. Provider methods also verify malformed responses, invalid source ranges and restart. The independent Search fixture uses its own atomic-file state transitions and predicate evaluation. Both providers consume the authoritative commit feed; neither uses the oracle or foreign SQL. Current authorization is checked before reads, continuation, replay and commit, including revocation. These observations cover same-host process termination with intact storage, not filesystem power failure or distributed failover.</desc>
