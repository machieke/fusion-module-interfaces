<text x="508" y="643.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Access or contract requirements fail</text>
<text x="1024" y="643.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Change authorization or requirements</text>
<rect x="72" y="687" width="1456" height="77" rx="6" fill="#FFFFFF"/>
