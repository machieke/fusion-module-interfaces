<text x="508" y="725.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Acceptance may already be durable</text>
<text x="1024" y="725.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Recover by key / job; do not assume</text>
<text x="1024" y="755.2900000000001" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">failure</text>
