<text x="508" y="315.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">No such scoped atom metadata</text>
<text x="1024" y="315.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Correct the reference</text>
<rect x="72" y="359" width="1456" height="77" rx="6" fill="#FFFFFF"/>
<text x="88" y="397.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">NOT_AVAILABLE</text>
<text x="508" y="397.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Known data / result temporarily</text>
<text x="508" y="427.29" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">unavailable</text>
<text x="1024" y="397.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Retry or query the owner</text>
<rect x="72" y="441" width="1456" height="77" rx="6" fill="#FFFFFF"/>
<text x="88" y="479.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">OVERLOADED</text>
<text x="508" y="479.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Capacity or current writer lock</text>
<text x="508" y="509.29" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">unavailable</text>
<text x="1024" y="479.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Back off; reuse key + semantic input</text>
<rect x="72" y="523" width="1456" height="77" rx="6" fill="#FFFFFF"/>
<text x="88" y="561.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#102B3F">CONFLICT</text>
<text x="508" y="561.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Same key changed meaning / revision</text>
<text x="508" y="591.2900000000001" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">mismatch</text>
<text x="1024" y="561.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Reconcile; do not blindly replay</text>
