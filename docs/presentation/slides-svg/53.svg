<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The limitations are part of the contract</title>
<desc id="desc">Bounds are 512 atoms, 4096 bytes per atom, 128 accepted relations, 512 relation replay keys, 256 indexed records, and pages/batches of at most eight. One lookup permits eight query pages, 32 roots, 128 relations and 64 payloads; caller commands and rebuild keys cap at 64. Strings are bounded to 128 codepoints/512 UTF-8 bytes; query encoding to 1024 bytes. Search trusts the immutable source contract and does not attest cryptographically against a compromised owner. Current authorization is rechecked, including historical result replay. Recovery covers same-host process kills with intact files, not power loss/distributed failover. Old profiles stay explicit; existing stores are not migrated. Maintainership remains UNASSIGNED. These are bounded reference modules, not full Omega product coverage.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">07 / GUARANTEES AND STOPPING POINT</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">The limitations are part of the contract</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">M5 adds bounded private discovery while preserving the prior cognition and chain limits.</text>
<rect x="72" y="250" width="704" height="219" rx="13" fill="#E4EBF5" stroke="#007C78"/>
<text x="94" y="301.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">Exact attributes; one-hop lookup</text>
<text x="94" y="348.28000000000003" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Case-sensitive conjunction over kind, topic</text>
<text x="94" y="384.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">and label. No embeddings, semantic search or</text>
<text x="94" y="419.96000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">task generation.</text>
<rect x="824" y="250" width="704" height="219" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="846" y="301.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#A86A15">Fresh profiles and intact files</text>
<text x="846" y="348.28000000000003" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Finite local stores. No migration, eviction or</text>
<text x="846" y="384.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">automatic repair; unavailable source bytes</text>
<text x="846" y="419.96000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">block indexing.</text>
<rect x="72" y="505" width="704" height="219" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="556.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Independent snapshots</text>
<text x="94" y="603.28" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Search prefix W and Relations head R are</text>
<text x="94" y="639.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">explicit. They do not form a global atomic</text>
<text x="94" y="674.9599999999999" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">snapshot.</text>
<rect x="824" y="505" width="704" height="219" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="846" y="556.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Earlier guarantees retain their limits</text>
<text x="846" y="603.28" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Cognitive budgets stay spent; closure can</text>
<text x="846" y="639.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">remain pending. Chain proof remains one local</text>
<text x="846" y="674.9599999999999" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">validator.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#EBE5F3"/>
<text x="94" y="799.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#7458A2">Stopped at M5: no new cognition, embeddings, scheduler, migration or chain operation.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
