<title id="title">Executed tests cover discovery, recovery and regressions</title>
<desc id="desc">The final clean bfb0ec8 run executed 18 fixture methods in 27.434 seconds, four real-provider methods in 22.088 seconds and seven native Hive cases in 111.519 seconds. Nine direct kills cover atom/feed commit, relation payload/acceptance and projection checkpoint/rebuild boundaries; four native kills cover page/result commits across both Search providers. Ordinary restarts are not extra kill scenarios. Supplemental probes check four attention/Search configurations and four payload transitions. The unchanged M1–M3.1 wrapper passed in 1325.251 seconds with aggregate 156, followed by 11 M4 fixtures and six real M4 cases in a new isolated namespace/state. Reused pinned node binary is explicit. Intermediate failures and repeated subsets are excluded from final counts. This presentation update audits the recorded results; it does not rerun integrations.</desc>
