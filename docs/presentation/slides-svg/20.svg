<title id="title">Evidence concentrates on boundaries that can fail</title>
<desc id="desc">The final local verification run passed 27 unittest tests with zero failures or skips. Applicable service conformance cases run under both in-process and subprocess bindings. Separately, the upstream detta-da library passed 62 tests and detta-storage passed 40, totalling 102. These are distinct counts and do not imply 27 tests for each binding or a full upstream regression for every repository. The chain build and real local chain demo also passed as separately recorded gates. Other checks included Rust formatting, Python compilation and git diff validation. Do not count unimplemented episode, belief, attention or inference test specifications as executed functionality. No full F1R3node, DAS, MeTTaClaw or cognitive regression suite is claimed.</desc>
