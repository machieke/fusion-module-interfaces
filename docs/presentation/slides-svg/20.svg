<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Real runtime, real provider, fixtures and unrun scope</title>
<desc id="desc">The native dispatch is not a wrapper named Omega around Peer. It is the verified Hive app and plugin mechanism with real PeTTa. TestClient is an ASGI test transport and the caller driver is a test harness, not a substituted runtime. The new caller tests use the real default Supervisor without starting minds; the 34 upstream baseline tests use their labelled fake process driver. DeTTa is real local library storage. Mailbox and execution are actual Fusion implementations, while the payload, counterparty and policy are fixtures. The deterministic inspect operation is plumbing, not a cognitive capability. No live LLM is used. The historical chain observation is neither erased nor represented as a new same-artifact Hive-to-chain run.</desc>
