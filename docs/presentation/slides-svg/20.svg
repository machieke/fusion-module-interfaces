<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Authority, replay and compatibility stay live</title>
<desc id="desc">Private authority validates complete descriptor selection and current principal, scope and method on every operation, including cached replay. The separate belief.revision.assume permission governs explicit pair assumptions. C2 also checks authority and expected revision after native calculation. Full acknowledgement-body fingerprints prevent substituting a different decision behind the same acknowledgement identity. Inputs are detached from caller mutation. Same-key semantic changes conflict, including expected revision and runtime selection. Genuine CAS conflicts require a new attempt identity; retryable NOT_AVAILABLE preserves the exact attempt. The relay is bounded to three CAS retries per drain and at most 32 attempts per delivery. It is not a general retry scheduler or inference controller.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
