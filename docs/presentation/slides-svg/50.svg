<title id="title">M5 gates: contracts, real storage and rebuild</title>
<desc id="desc">Gate statuses come directly from the committed M5 manifest and match the final verifier at clean bfb0ec8. All six final suite return codes are zero. Earlier intermediate PARTIAL and corrected development failures are preserved separately and contribute no final passes. An intentional missing-environment probe verifies BLOCKED/NOT_RUN classification and no fixture fallback. Legacy real chain is rerun as existing M4 behavior, not an added M5 operation. All fifteen reference families are represented, but scope remains exact-attribute discovery and one-hop traversal over bounded fresh private stores.</desc>
