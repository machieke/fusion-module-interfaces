<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Real providers and fixtures remain visibly separate</title>
<desc id="desc">All ten required M4 gates pass, including real chain. Legacy nested verifier CHAIN=NOT_RUN fields describe earlier scope; the outer M4 REAL_CHAIN_EFFECT=PASS supplies the new evidence. The historical M1 dirty-source reproduction remains blocked independently. One actual native caller and one fixture counterparty are not two production Omega agents. TestClient transport, generated identities and deterministic kill pauses are fixtures; Hive authentication/dispatch, default Supervisor, PeTTa, DeTTa and F1R3node are real. The independent atomic-file attention provider remains a fixture. The full upstream Hive suite, historical SWI 10.0.1, public networks and production security/quality studies are unrun. No fixture pass substitutes for chain or native math.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">06 / EVIDENCE CLASSIFICATION</text>
<text x="70" y="142.5" font-family="DejaVu Sans" font-size="50" font-weight="700" fill="#102B3F">Real providers and fixtures remain visibly separate</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A real runtime can execute generated inputs. Each claim carries its own evidence label.</text>
