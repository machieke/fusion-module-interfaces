<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Native goldens check deduction and preserved revision</title>
<desc id="desc">The M3 golden has five ordered premises and uses the actual native Truth_Deduction. Expected values are independent test oracles, not production mathematics. M2 revision goldens still pass in the M3 regression, including reversed unequal pairs. Native suites include actual computation plus explicitly injected malformed responses, timeouts, source-drift clones and authorization/CAS interleavings. Fifteen upstream guard-only tests use RecordingRuntime and are not counted as native numerical evaluation. Evidence_count remains null, and a derived conclusion never turns into a fresh independent observation.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / NUMERICAL EVIDENCE</text>
<text x="70" y="138.7" font-family="DejaVu Sans" font-size="46" font-weight="700" fill="#102B3F">Native goldens check deduction and preserved revision</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Independent expected values check pinned native formulas; no replacement math runs in the owners.</text>
<rect x="72" y="248" width="704" height="347" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="94" y="300.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">M3 · Grounded deduction</text>
<text x="94" y="348.51" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">P, Q, R = (0.5, 0.8)</text>
<text x="94" y="385.63" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">P⇒Q, Q⇒R = (0.8, 0.7)</text>
<text x="94" y="422.75" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775"></text>
<text x="94" y="459.87" font-family="DejaVu Sans" font-size="29" font-weight="400" fill="#536775">Expected P⇒R: (0.68, 0.3136)</text>
<rect x="800" y="248" width="728" height="347" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="822" y="300.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">M2 · Guarded revision</text>
<text x="822" y="347.56" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">(0.75, 0.50) + (0.25, 0.50)</text>
<text x="822" y="383.4" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">→ (0.50, 2/3)</text>
<text x="822" y="419.24" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775"></text>
<text x="822" y="455.08" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Unequal confidence 0.50 / 0.75</text>
<text x="822" y="490.92" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">→ (0.375, 0.80)</text>
<text x="78" y="667.65" font-family="DejaVu Sans Mono" font-size="27" font-weight="400" fill="#102B3F">Observed deduction: 0.6800000000000002 / 0.31360000000000005</text>
<text x="78" y="724.6" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#102B3F">Absolute tolerance 1e−12; finite-domain and lineage guards remain active.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="798.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">These are model-specific heuristics, not calibrated real-world confidence or proven entailment.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
<text x="72" y="867.25" font-family="DejaVu Sans" font-size="15" font-weight="400" fill="#536775">OMEGA × ASI / THROUGH M4 / test_deduction.py · preserved test_revision.py</text>
