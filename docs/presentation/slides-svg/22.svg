<title id="title">The recorded story keeps copies and disagreement</title>
<desc id="desc">This slide reads the committed CLI demo record, whose own classification is: generated fixture, real DeTTa and native PLN; this CLI is not the Hive gate. It is not relabelled as a native Hive trace. The real Hive test suite independently exercises the same integration/m2_scenario.py through native authentication and Programs dispatch. The story contains 4 events and 2 retained alternatives. A separate pair of 2 generated independent observations produces strength 0.5, confidence 0.6666666666666666, evidence_count null. Exact restart result equality is True. The ancestor outcome is retained-alternative; no extra observation or numerical contribution is created. No real-world source reliability is inferred from generated assessments.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
