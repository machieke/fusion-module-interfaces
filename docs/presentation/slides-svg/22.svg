<text x="1014" y="406.8" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">Small local harness; no distributed</text>
<text x="1014" y="437.52000000000004" font-family="DejaVu Sans" font-size="24" font-weight="400" fill="#536775">scheduler</text>
