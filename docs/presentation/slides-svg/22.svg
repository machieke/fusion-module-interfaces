<text x="70" y="139.65" font-family="DejaVu Sans" font-size="47" font-weight="700" fill="#102B3F">The design trades breadth for inspectable guarantees</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Accepted prototype choices; community models and production guarantees remain unresolved.</text>
