<text x="70" y="141.55" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#102B3F">Private history stays in a separate local composition</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">The authenticated actor selects an operator-configured scope; request data cannot nominate authority.</text>
