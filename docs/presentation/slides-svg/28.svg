<title id="title">Provenance includes working-tree state</title>
<desc id="desc">The commit prefixes are navigation aids; the committed sources.json contains full identifiers, absolute roots, remotes, dirty-file lists and relevant working-source fingerprints. The real DeTTa and F1R3 builds used pre-existing modified source, so clean HEAD alone is insufficient to reproduce identical behavior. MeTTaClaw had untracked runtime/project artifacts. This task did not alter upstream sources or commit those upstream changes. Only the fusion-module-interfaces workspace is committed. The supplied Hive repository is an index; no actual Hive runtime checkout was available. Meeting transcripts were referenced in the brief but not independently supplied or inspected. The intended earlier Omega type/interface registry was not found; the static registry remains a bounded harness implementation.</desc>
