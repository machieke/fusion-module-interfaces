<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Independent goldens check the actual native result</title>
<desc id="desc">These are independent expected-value oracles for actual Truth_Revision through native PeTTa/SWI, not replacement production arithmetic. The valid-result absolute tolerance is 1e-12. Decimal-string inputs must pass both decimal and float64 domain checks; a value that rounds confidence to one is refused, not clamped. Nonfinite values, wrong model/context/claim, zero total weight and malformed native output fail explicitly. evidence_count remains null. The golden tests include equal, unequal and swapped input order. Malformed/empty/multiple output tests are labelled injected fixtures inside the broader native-provider suite. These computations do not validate the external truth or statistical independence of observations.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">03 / NUMERICAL EVIDENCE</text>
<text x="70" y="142.5" font-family="DejaVu Sans" font-size="50" font-weight="700" fill="#102B3F">Independent goldens check the actual native result</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Pairs are explicit assessments of the same claim, with permitted independence and disjoint lineage.</text>
<text x="88" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">INPUT PAIR · (STRENGTH, CONFIDENCE)</text>
<text x="708" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">EXPECTED NATIVE RESULT</text>
<text x="1048" y="251.15" font-family="DejaVu Sans" font-size="17" font-weight="700" fill="#536775">MEANING</text>
<rect x="72" y="277" width="1456" height="102" rx="6" fill="#FFFFFF"/>
<text x="88" y="318.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">(0.75, 0.50) + (0.25, 0.50)</text>
<text x="708" y="318.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">(0.50, 2/3)</text>
<text x="1048" y="318.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Equal weight balances the</text>
<text x="1048" y="351.97999999999996" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">assessments</text>
<rect x="72" y="384" width="1456" height="102" rx="6" fill="#FFFFFF"/>
<text x="88" y="425.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">(0.75, 0.50) + (0.25, 0.75)</text>
<text x="708" y="425.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">(0.375, 0.80)</text>
<text x="1048" y="425.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Higher confidence shifts the result</text>
<rect x="72" y="491" width="1456" height="102" rx="6" fill="#FFFFFF"/>
<text x="88" y="532.7" font-family="DejaVu Sans" font-size="26" font-weight="700" fill="#102B3F">Same unequal pair, reversed</text>
<text x="708" y="532.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">(0.375, 0.80)</text>
<text x="1048" y="532.7" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">Order does not change this</text>
<text x="1048" y="565.98" font-family="DejaVu Sans" font-size="26" font-weight="400" fill="#536775">revision</text>
<rect x="72" y="622" width="704" height="127" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="94" y="667.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#007C78">Domain: finite values only</text>
<text x="94" y="707.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">0 ≤ strength ≤ 1; 0 ≤ confidence &lt; 1</text>
<rect x="800" y="622" width="728" height="127" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="822" y="667.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#A86A15">No silent clamping</text>
<text x="822" y="707.85" font-family="DejaVu Sans" font-size="23" font-weight="400" fill="#536775">Invalid inputs and zero total weight are refused.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="798.75" font-family="DejaVu Sans" font-size="25" font-weight="700" fill="#102B3F">Confidence belongs to the selected model; it is not a guarantee that the real-world claim is true.</text>
<line x1="72" y1="839" x2="1528" y2="839" stroke="#C9D2D4" stroke-width="1"/>
