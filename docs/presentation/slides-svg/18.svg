<title id="title">What ran, what was a fixture, what is unavailable</title>
<desc id="desc">DeTTa means actual DA and FileStorage code executed against local persisted shares, not a mock and not a custody network. F1R3node means a real local node with a fresh isolated genesis and one validator, not public mainnet/testnet or multi-validator safety. Peers are independently instantiated protocol fixtures; inspect_atom is a deterministic fixture operation running in a real OS process. Authorization is an explicit local policy fixture. Fake chain responses exist only in unit tests and are distinct from the real chain evidence. The supplied omegahive-start-here repository is an onboarding index; the intended Hive runtime checkout is absent. DAS, MeTTaClaw, metta-attention and reachability were inspected, but their cognitive/channel providers were not integrated. No upstream source files were changed.</desc>
