<text x="70" y="141.55" font-family="DejaVu Sans" font-size="49" font-weight="700" fill="#102B3F">Five crash boundaries, independent owner commits</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">10 direct boundary cases + 5 actual Hive caller boundary cases in the recorded M3 run.</text>
