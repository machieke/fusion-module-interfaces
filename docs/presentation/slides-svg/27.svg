<text x="70" y="143.45" font-family="DejaVu Sans" font-size="51" font-weight="700" fill="#102B3F">C4: reserve work durably before invoking the rule</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A work budget limits physical evaluation opportunities, even when the process dies.</text>
