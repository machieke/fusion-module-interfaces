<text x="70" y="140.6" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#102B3F">M2 gates: privacy, recovery, Hive and reproducibility</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">No M2 prerequisite remains blocked. Optional or excluded work retains its own status.</text>
