<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">The limitations are part of the contract</title>
<desc id="desc">M4 adds a fresh single-operation journal and explicit chain profile; legacy finality and cognitive profiles remain selectable. It does not migrate state or repair pre-existing M3 pending work. M3.1 closure retains finite capacity and eligible/unavailable pending outcomes; reservations and absolute deadlines never reset. M4 observation is bounded and call-driven: at most 120 calls start, no new calls start after 180 seconds, and existing 15-second socket timeouts can finish later; at most 256 observations are retained. No scheduler or unbounded polling is added. One native caller and one fixture counterparty do not establish a multi-agent production system. Files and local post-state must remain available. Trusted operator/host, warm downloads and single-validator genesis are explicit assumptions. Production security/economics, power loss, distributed failover and full upstream Hive suite remain unrun.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">06 / GUARANTEES AND STOPPING POINT</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">The limitations are part of the contract</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A successful local commitment preserves the existing private cognition and closure limits.</text>
<rect x="72" y="250" width="704" height="219" rx="13" fill="#E4EBF5" stroke="#007C78"/>
<text x="94" y="301.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#007C78">One shareable workflow</text>
<text x="94" y="348.28000000000003" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Generated inspect result only. Private</text>
<text x="94" y="384.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">episodes, beliefs, provenance and identifying</text>
<text x="94" y="419.96000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">hashes stay private.</text>
<rect x="824" y="250" width="704" height="219" rx="13" fill="#F3E7CE" stroke="#A86A15"/>
<text x="846" y="301.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#A86A15">One real local validator</text>
<text x="846" y="348.28000000000003" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Node-observed effect and finality. No</text>
<text x="846" y="384.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">decentralized safety, trustless attestation or</text>
<text x="846" y="419.96000000000004" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">reasoning certification.</text>
<rect x="72" y="505" width="704" height="219" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="556.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Fresh profiles and intact files</text>
<text x="94" y="603.28" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">No journal migration. Recovery is same-host</text>
<text x="94" y="639.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">process restart; power loss and distributed</text>
<text x="94" y="674.9599999999999" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">failover unrun.</text>
<rect x="824" y="505" width="704" height="219" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="846" y="556.45" font-family="DejaVu Sans" font-size="31" font-weight="700" fill="#315E9C">Bounded progress stays explicit</text>
<text x="846" y="603.28" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Old inference budgets stay spent; closure can</text>
<text x="846" y="639.12" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">remain pending. Chain observation is</text>
<text x="846" y="674.9599999999999" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">call-driven and finite.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#EBE5F3"/>
<text x="94" y="796.85" font-family="DejaVu Sans" font-size="23" font-weight="700" fill="#7458A2">Stopped at M4: no new cognition, scheduler, ECAN, LTI, search, migration or public-network attachment.</text>
