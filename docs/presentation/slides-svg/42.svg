<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Actual Hive discovers the answers through the interfaces</title>
<desc id="desc">The real native fusion-lookup sibling uses authenticated Hive Programs dispatch and the pinned PeTTa runtime. A separate writer uses only declared ports to create five matching task records, three prerequisites, fifteen requires edges, distractors, an unrelated association, an ignored text atom and a same-match record in another scope; IDs are random and insertion order is shuffled. Two native corpus runs confirm counts and restart/rebuild/substitution. The consumer calls query, outgoing, getRelation, incoming and get/getMany through backend-independent ports. Supplemental authorized private probes compare complete reference sets and canonical payload bytes across initial, catch-up, rebuild and substitution, without publishing private identifiers. Search replacement rebuilds from the same feed rather than inheriting primary index state.</desc>
