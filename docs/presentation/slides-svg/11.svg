<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Compatibility is a semantic filter</title>
<desc id="desc">The resolver filters interface identity and a consumer&#x27;s explicit same-major interval, exact profile and required features, supported operations, advertised guarantees, payload limits and privacy. Any required measured latency must be present in descriptor measurements. Required verification always fails because no verifier is available. Advertisements and evidence remain distinct. The actual M1 dispatch only accepts wire 1.0.0. A separate descriptor fixture at 1.2.3 exercises additive resolution; it is not evidence of a deployed 1.2.3 service. Unsupported requirements produce typed errors instead of weaker fallback selection. Interface 1.0.0 stabilizes this prototype, not an agreed community standard.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">02 / DESIGN DETAILS · RESOLUTION</text>
<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Compatibility is a semantic filter</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A matching name is only the start of provider selection.</text>
