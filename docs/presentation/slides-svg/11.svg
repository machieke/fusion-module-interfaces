<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Replace the provider; keep the consumer’s contract</title>
<desc id="desc">The four recorded M1.2 substitution workflows use protocol fixture callers, two AtomStorage implementations and two bindings. The independent file fixture neither inherits AtomOwner nor uses its atom table. The final M2 regression reruns the preserved matrix. M2 separately proves C1 against the independent file provider with cognition absent and hostile declared-port wrappers. Do not label the file fixture as another real DA provider. Wire remains 1.0.0 and immutable-bytes/1 remains unchanged. C1/C2 use local interface 2.0.0, implementation 0.2.0 and explicit private profiles. Descriptor hashes bind selection consistency, not provider honesty. These are fresh-store tests, not live namespace replacement or migration.</desc>
