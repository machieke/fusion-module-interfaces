<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Compatibility binds semantics and selected replies</title>
<desc id="desc">The resolver uses fixed consumer requirements, exact profiles, supported operations, privacy and claimed guarantees. Binding invocation and success replies carry the selected descriptor token; response validation checks shape, scope, references, integrity, receipts and known correlation. The native adapter loads operator-selected descriptors and uses that same boundary. Native-path tests reject an incompatible profile and a changed descriptor. Wire remains 1.0.0; the /2 messaging and execution profiles describe neutral process-restart receipts and recoverable status. They do not imply live 1.x rolling interoperability. No proof verifier is installed, so required verification fails closed.</desc>
