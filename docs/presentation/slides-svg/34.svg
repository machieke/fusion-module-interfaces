<title id="title">Reproducibility connects source, build and observed result</title>
<desc id="desc">Requested ancestor c4498ce3047f1283d3a4a3ae3d09b713e7dcf312; actual starting descendant 3b34e00df75055d54a57ba7e38eb8b2d9e82ed7e; tested source 1b17d74f2808703894ea55c9539adf264bc87976; evidence-only descendant 985d2f34ea8df8c5d93582e4ed6fe5cbe1843074. Build_m3.py wraps the byte-identical M2 recipe and adds the separately selected deduction configuration. All exercised upstream sources were clean at their pins. Historical M2 SWI binary identity differs from the fresh M3 build and is not silently equated. Exact hashes, versions, command arguments, durations and JUnit results are committed. Provider environment files can contain local configuration and are deliberately excluded from published evidence. This deck hashes its evidence inputs and audits the archive without modifying it.</desc>
