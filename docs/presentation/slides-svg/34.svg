<title id="title">Future cognition remains a set of review obligations</title>
<desc id="desc">This is a proposed future dependency map, not evidence of an executed cognitive loop. Inference control would use Search, Attention, C2 and a general pure PLN kernel through explicit ports. Attention owns its own budgets/balances and logical time, without a required PLN or LLM dependency. The general kernel returns proposals over immutable premises. Inference control owns only step receipts/checkpoints, not truth or attention state. Relations/Search, ECAN, general rules and inference control remain future contracts with model/policy and conformance obligations. M2&#x27;s narrow RevisionMath provider is distinct from applyRule. No new work in these modules was undertaken.</desc>
