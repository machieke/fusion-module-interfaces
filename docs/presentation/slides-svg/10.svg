<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">AtomStorage replacement is independently exercised</title>
<desc id="desc">The committed M1.2 matrix contains 4 workflows: DeTTa and fixture-files under both in-process and private subprocess bindings. These peers remain fixtures; this matrix is not relabelled as the new native Hive test. Execution depends on declared AtomStorage and CompletionDelivery ports and does not inspect concrete atom owners. The file fixture owns atomic payload/record files and is independently implemented. This proves substitutability in the documented fresh-store profile. It is not another DA network, live namespace switching, a journal migration or distributed placement. M1.2 preserves these boundaries without changing fusion/.</desc>
