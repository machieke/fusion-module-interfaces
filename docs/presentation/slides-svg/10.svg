<text x="70" y="140.6" font-family="DejaVu Sans" font-size="48" font-weight="700" fill="#102B3F">AtomStorage replacement is independently exercised</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Protocol fixture callers exercise two providers and two transports; the worker logic is unchanged.</text>
