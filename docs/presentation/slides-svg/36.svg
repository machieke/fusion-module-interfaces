<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">C1 acknowledgment compatibility remains an open seam</title>
<desc id="desc">M3 does not solve this seam with a generic event bus, migration or a false success receipt. Generated C1 intents remain available and pending; direct M3 evidence/derivation admission and replay are nevertheless durable. The dashed bracket marks an incompatible response seam, not an executed call. The original M2 path retains its own supported DTO and acknowledgment behavior. A bounded step can also finish with unacknowledged work because an attempt was lost, a deadline elapsed or the attention clock advanced before feedback. Read the precise receipt counters and pending state instead of treating completion as global convergence.</desc>
<rect width="1600" height="900" fill="#F4F2EB"/>
<text x="72" y="61.05" font-family="DejaVu Sans" font-size="19" font-weight="700" fill="#007C78">APPENDIX D / HONEST COMPLETION SEMANTICS</text>
<text x="70" y="137.75" font-family="DejaVu Sans" font-size="45" font-weight="700" fill="#102B3F">C1 acknowledgment compatibility remains an open seam</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">A durable M3 admission and an M2 evidence-delivery acknowledgment are different results.</text>
<rect x="72" y="270" width="420" height="205" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="94" y="322.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">C1 · Local v2</text>
<text x="94" y="369.56" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Keeps the generated</text>
<text x="94" y="405.4" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">episode and its available</text>
<text x="94" y="441.24" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">pending delivery intents.</text>
<rect x="589" y="270" width="420" height="205" rx="13" fill="#DCEFE8" stroke="#007C78"/>
<text x="611" y="322.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#007C78">C2 · Local v3</text>
<text x="611" y="369.56" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">Direct derivation</text>
<text x="611" y="405.4" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">admission and exact</text>
<text x="611" y="441.24" font-family="DejaVu Sans" font-size="28" font-weight="400" fill="#536775">logical replay are durable.</text>
<rect x="1106" y="270" width="422" height="205" rx="13" fill="#E4EBF5" stroke="#315E9C"/>
<text x="1128" y="322.4" font-family="DejaVu Sans" font-size="32" font-weight="700" fill="#315E9C">C4 receipt</text>
<text x="1128" y="368.60999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">Records bounded progress,</text>
<text x="1128" y="403.16999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">pending feedback and</text>
<text x="1128" y="437.72999999999996" font-family="DejaVu Sans" font-size="27" font-weight="400" fill="#536775">explicit terminal reason.</text>
<line x1="799" y1="475" x2="799" y2="559" stroke="#A86A15" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="799" y1="559" x2="282" y2="559" stroke="#A86A15" stroke-width="2" stroke-dasharray="6 5"/>
<line x1="282" y1="559" x2="282" y2="475" stroke="#A86A15" stroke-width="2" stroke-dasharray="6 5"/>
<rect x="281" y="537" width="750" height="47" rx="0" fill="#F4F2EB"/>
<text x="304" y="573.55" font-family="DejaVu Sans" font-size="29" font-weight="700" fill="#A86A15">v3 snapshot ≠ v2 acknowledgment DTO</text>
<text x="78" y="680.5" font-family="DejaVu Sans" font-size="30" font-weight="700" fill="#102B3F">Original M2 relay + acknowledgment tests still pass under the original profile.</text>
<rect x="72" y="765" width="1456" height="53" rx="8" fill="#E7ECEB"/>
<text x="94" y="797.8" font-family="DejaVu Sans" font-size="24" font-weight="700" fill="#102B3F">No fabricated acknowledgment, silent profile widening or claim that every delivery intent is drained.</text>
