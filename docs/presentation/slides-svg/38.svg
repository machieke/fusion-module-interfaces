<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Retry decisions preserve meaning across owners</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Separate acceptance, numerical effect and acknowledgement before choosing a recovery action.</text>
