<text x="70" y="144.4" font-family="DejaVu Sans" font-size="52" font-weight="700" fill="#102B3F">Retry identities answer different questions</text>
<text x="73" y="188.75" font-family="DejaVu Sans" font-size="25" font-weight="400" fill="#536775">Preserve the logical cause while distinguishing transport replay from physical evaluation attempts.</text>
