name: Reference contracts (zero generation)
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Public contract dependencies only
        run: python -m pip install -r deploy/single-node/ci-requirements.txt
      - name: Fast contracts; no cluster, native provider or runtime access
        run: python -m integration.single_node.reference_ci fast
# Native/cluster/chain/artifact lanes are explicit local commands on a trusted
# operator's runner. This workflow has no kubeconfig, keys, model cache, privileged
# self-hosted runner, registry publication, deploy or generative backend job.
