name: Reference contracts (zero generation)
on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Public contract dependencies only
        run: python -m pip install -r deploy/single-node/ci-requirements.txt
      - name: Fast contracts; no cluster, native provider or runtime access
        run: python -m integration.single_node.reference_ci fast
  preview-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public dependencies; no model or private asset installation
        run: python -m pip install -r deploy/single-node/preview-ci-requirements.txt
      - name: Preview contracts, recorded fixtures and local vector indexes
        run: python -m integration.single_node.reference_ci preview-fast --output artifacts/phase2-ci
  sustained-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public dependencies only
        run: python -m pip install -r deploy/single-node/preview-ci-requirements.txt
      - name: Sustained contracts; no cluster or generative runtime authority
        run: python -m integration.single_node.reference_ci sustained-fast --output artifacts/phase3-ci
  integrated-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Public contract dependencies; no native or model assets
        run: python -m pip install -r deploy/single-node/preview-ci-requirements.txt
      - name: Integrated contracts, archive integrity and recorded owner recovery
        run: python -m integration.single_node.reference_ci integrated-fast --output artifacts/integrated-ci
  operator-pilot-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GOTOOLCHAIN: local
      GOPROXY: 'off'
      CGO_ENABLED: '0'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Pinned public dependencies and isolated tooling
        run: |
          python -m pip install -r deploy/single-node/preview-ci-requirements.txt
          mkdir -p "$RUNNER_TEMP/pilot-tools" "$RUNNER_TEMP/pilot-go-cache"
          curl --fail --location https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz -o "$RUNNER_TEMP/pilot-tools/helm.tar.gz"
          printf '%s  %s\n' 0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b "$RUNNER_TEMP/pilot-tools/helm.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/pilot-tools/helm.tar.gz" -C "$RUNNER_TEMP/pilot-tools"
          curl --fail --location https://go.dev/dl/go1.27.3.linux-amd64.tar.gz -o "$RUNNER_TEMP/pilot-tools/go.tar.gz"
          printf '%s  %s\n' 65efbc80fdc1fa2cd2631cad5b481777a68e8725f34e89f50fc6ac714e379b40 "$RUNNER_TEMP/pilot-tools/go.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/pilot-tools/go.tar.gz" -C "$RUNNER_TEMP/pilot-tools"
          echo "$RUNNER_TEMP/pilot-tools/linux-amd64" >> "$GITHUB_PATH"
          echo "$RUNNER_TEMP/pilot-tools/go/bin" >> "$GITHUB_PATH"
          echo "GOCACHE=$RUNNER_TEMP/pilot-go-cache" >> "$GITHUB_ENV"
      - name: Owner, browser, maintenance and recorded state-machine contracts
        run: python -m integration.single_node.reference_ci pilot-fast --output artifacts/operator-pilot-ci
      - name: Independent provider capacity composition; real Helm and synthetic values
        run: python -m unittest tests.test_pilot_go_capacity_chart tests.test_pilot_go_capacity_operator -v
      - name: Pilot reply and incident safety
        run: python -m unittest tests.test_pilot_reply_faults tests.test_pilot_incidents tests.test_pilot_network_edges tests.test_pilot_operator_package.QualifierObservers -v
      - name: Scoped maintenance qualification guards; explicit protocol fixtures
        run: python -m unittest tests.test_pilot_attention_suspension tests.test_pilot_live_pool_subscription tests.test_pilot_artifact_reference tests.test_pilot_handover_activated_resume tests.test_pilot_chain_readiness -v
      - name: Independent provider and client contracts; no cluster or private configuration
        working-directory: sdk/go
        run: go test -count=1 -json ./... > ../../artifacts/operator-pilot-ci/go-test.jsonl
# Native/cluster/chain/artifact lanes are explicit local commands on a trusted
# operator's runner. This workflow has no kubeconfig, keys, model cache, privileged
# self-hosted runner, registry publication, deploy or generative backend job.
