{{- range $name, $component := .Values.components }}
{{- $config := dict "role" $name "service_composition" "neoclaw-separated-services/1" "state" "/state" "run" "/run/fusion" "secret_directory" "/secrets" "https_port" $.Values.httpsPort "capacity" $component.config.capacity "revision" $component.config.revision "native_enabled" $component.config.nativeEnabled "worker_enabled" $component.config.workerEnabled "enable_test_faults" $.Values.testFaultsEnabled "test" $component.config.test "peers" (dict "fusion-execution" (printf "fusion-execution.%s.svc.cluster.local" $.Release.Namespace) "fusion-storage" (printf "fusion-storage.%s.svc.cluster.local" $.Release.Namespace) "fusion-messaging" (printf "fusion-messaging.%s.svc.cluster.local" $.Release.Namespace)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
data:
  component.json: {{ $config | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
  ports:
    - {name: https, port: {{ $.Values.httpsPort }}, targetPort: https}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-pods
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
  ports:
    - {name: https, port: {{ $.Values.httpsPort }}, targetPort: https}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
spec:
  # Journal owners are not horizontally scalable. StatefulSet replaces an
  # ordinal after terminating its predecessor; the PVC flock is the final guard.
  replicas: 1
  serviceName: {{ $name }}-pods
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
      annotations:
        checksum/config: {{ $config | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.repository }}{{ if $.Values.image.digest }}@{{ $.Values.image.digest }}{{ else }}:{{ $.Values.image.tag }}{{ end }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          env:
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          ports:
            - {name: https, containerPort: {{ $.Values.httpsPort }}}
          resources: {{ toYaml $component.resources | nindent 12 }}
          startupProbe:
            httpGet: {scheme: HTTPS, path: /health/startup, port: https}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /health/ready, port: https}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /health/live, port: https}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - {name: state, mountPath: /state}
            - {name: runtime, mountPath: /run/fusion}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
        - {name: runtime, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - name: config
          configMap: {name: {{ $name }}}
        - name: secrets
          secret: {secretName: {{ required "existingSecret must name a pre-created Secret" $component.existingSecret }}, defaultMode: 0440}
  volumeClaimTemplates:
    - metadata:
        name: state
        labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $component.persistence.storageClass | quote }}
        resources: {requests: {storage: {{ $component.persistence.size | quote }}}}
{{- end }}
