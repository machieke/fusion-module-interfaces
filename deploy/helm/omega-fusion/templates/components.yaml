{{- range $name, $component := .Values.components }}
{{- if (not (hasKey $component "enabled")) | or $component.enabled }}
{{- $memoryRole := and $.Values.memory.enabled (has $name (list "omega-agent" "fusion-storage" "fusion-search" "fusion-embedding")) }}
{{- $memoryAgent := and $memoryRole (eq $name "omega-agent") }}
{{- $workflow := $.Values.workflow.enabled }}
{{- $reference := $.Values.reference.enabled }}
{{- $chain := and $reference (eq $.Values.reference.profile "chain") }}
{{- $plain := or (eq $name "f1r3node") $memoryAgent (and $workflow (has $name (list "fusion-channel-bridge" "irc-server" "irc-peer"))) }}
{{- $portName := ternary "health" "https" $plain }}
{{- $composition := ternary "neoclaw-memory-services/1" "neoclaw-separated-services/1" $memoryRole }}
{{- if $workflow }}{{- $composition = "neoclaw-model-channel-services/1" }}{{- end }}
{{- if $reference }}{{- $composition = "synthetic-cognitive-services/1" }}{{- end }}
{{- if $chain }}{{- $composition = "generated-inspect-services/1" }}{{- end }}
{{- $image := default $.Values.image $component.image }}
{{- $config := dict "role" $name "service_composition" $composition "state" "/state" "run" "/run/fusion" "secret_directory" "/secrets" "https_port" $.Values.httpsPort "capacity" $component.config.capacity "revision" $component.config.revision "native_enabled" $component.config.nativeEnabled "worker_enabled" $component.config.workerEnabled "enable_test_faults" $.Values.testFaultsEnabled "test" $component.config.test "peers" (dict "fusion-execution" (printf "fusion-execution.%s.svc.cluster.local" $.Release.Namespace) "fusion-storage" (printf "fusion-storage.%s.svc.cluster.local" $.Release.Namespace) "fusion-messaging" (printf "fusion-messaging.%s.svc.cluster.local" $.Release.Namespace) "fusion-search" (printf "fusion-search.%s.svc.cluster.local" $.Release.Namespace) "fusion-embedding" (printf "fusion-embedding.%s.svc.cluster.local" $.Release.Namespace)) }}
{{- if not $.Values.memory.enabled }}
{{- $_ := unset $config.peers "fusion-search" }}
{{- $_ := unset $config.peers "fusion-embedding" }}
{{- end }}
{{- if $reference }}
{{- range $peer := list "fusion-episodes" "fusion-beliefs" "fusion-attention" "fusion-relations" "fusion-exact-search" "fusion-commitment" "f1r3node" }}
{{- $_ := set $config.peers $peer (printf "%s.%s.svc.cluster.local" $peer $.Release.Namespace) }}
{{- end }}
{{- $_ := set $config "reference" $.Values.reference }}
{{- end }}
{{- if $workflow }}
{{- range $peer := list "fusion-model" "fusion-channel-bridge" "irc-server" "irc-peer" }}
{{- $_ := set $config.peers $peer (printf "%s.%s.svc.cluster.local" $peer $.Release.Namespace) }}
{{- end }}
{{- $w := deepCopy (omit $.Values.workflow "phase") }}
{{- if eq $name "omega-agent" }}{{- $_ := set $w "phase" $.Values.workflow.phase }}{{- end }}
{{- if ne $name "fusion-model" }}{{- $_ := unset $w "responses" }}{{- end }}
{{- $_ := set $config "workflow" $w }}
{{- end }}
{{- if $memoryRole }}
{{- $_ := set $config "memory" (omit $.Values.memory "enabled") }}
{{- end }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
data:
  component.json: {{ $config | toJson | quote }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
spec:
  type: ClusterIP
  selector: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
  ports:
    {{- if eq $name "irc-server" }}
    - {name: irc, port: 6667, targetPort: irc}
    {{- end }}
    {{- if eq $name "f1r3node" }}
    - {name: chain-read, port: 40403, targetPort: 40403}
    {{- end }}
    - {name: {{ $portName }}, port: {{ $.Values.httpsPort }}, targetPort: {{ $portName }}}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-pods
spec:
  clusterIP: None
  selector: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
  ports:
    {{- if eq $name "irc-server" }}
    - {name: irc, port: 6667, targetPort: irc}
    {{- end }}
    {{- if eq $name "f1r3node" }}
    - {name: chain-read, port: 40403, targetPort: 40403}
    {{- end }}
    - {name: {{ $portName }}, port: {{ $.Values.httpsPort }}, targetPort: {{ $portName }}}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
spec:
  # Journal owners are not horizontally scalable. StatefulSet replaces an
  # ordinal after terminating its predecessor; the PVC flock is the final guard.
  replicas: {{ ternary 0 1 (and $.Values.futureLive.enabled (not $.Values.futureLive.activated) (has $name (list "fusion-model" "fusion-channel-bridge" "irc-server" "irc-peer"))) }}
  serviceName: {{ $name }}-pods
  podManagementPolicy: OrderedReady
  updateStrategy: {type: RollingUpdate}
  persistentVolumeClaimRetentionPolicy: {whenDeleted: Retain, whenScaled: Retain}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
      annotations:
        checksum/config: {{ $config | toJson | sha256sum }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext: {runAsNonRoot: true, runAsUser: 1000, runAsGroup: 1000, fsGroup: 1000}
      containers:
        - name: {{ $name }}
          image: "{{ $image.repository }}{{ if $image.digest }}@{{ $image.digest }}{{ else }}:{{ $image.tag }}{{ end }}"
          imagePullPolicy: {{ $image.pullPolicy }}
          {{- if and $.Values.futureLive.enabled (eq $name "fusion-model") }}
          command: ["/opt/native/python/bin/python3.12", "-m", "integration.single_node.future_live", "/campaign/plan.json", "--approval", "/approval/approval.json", "--component", "/config/component.json", "--supervise"]
          {{- end }}
          env:
            - name: POD_NAMESPACE
              valueFrom: {fieldRef: {fieldPath: metadata.namespace}}
            - name: POD_NAME
              valueFrom: {fieldRef: {fieldPath: metadata.name}}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          ports:
            {{- if eq $name "irc-server" }}
            - {name: irc, containerPort: 6667}
            {{- end }}
            - {name: {{ $portName }}, containerPort: {{ $.Values.httpsPort }}}
          resources: {{ toYaml $component.resources | nindent 12 }}
          startupProbe:
            httpGet: {scheme: {{ ternary "HTTP" "HTTPS" $plain }}, path: /health/startup, port: {{ $portName }}}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: {{ ternary 300 45 (and $.Values.futureLive.enabled (eq $name "fusion-model")) }}
          readinessProbe:
            httpGet: {scheme: {{ ternary "HTTP" "HTTPS" $plain }}, path: /health/ready, port: {{ $portName }}}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet: {scheme: {{ ternary "HTTP" "HTTPS" $plain }}, path: /health/live, port: {{ $portName }}}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            {{- if and $.Values.futureLive.enabled (has $name (list "fusion-model" "omega-agent")) }}
            - {name: campaign, mountPath: /campaign, readOnly: true}
            - {name: approval, mountPath: /approval, readOnly: true}
            {{- end }}
            {{- if and $.Values.futureLive.enabled (eq $name "fusion-model") }}
            - {name: generative-assets, mountPath: /opt/generative/models, subPath: models, readOnly: true}
            {{- end }}
            - {name: state, mountPath: /state}
            - {name: runtime, mountPath: /run/fusion}
            - {name: tmp, mountPath: /tmp}
            - {name: config, mountPath: /config, readOnly: true}
            - {name: secrets, mountPath: /secrets, readOnly: true}
      volumes:
        {{- if and $.Values.futureLive.enabled (has $name (list "fusion-model" "omega-agent")) }}
        - name: campaign
          configMap: {name: {{ $.Values.futureLive.planConfigMap }}, optional: true}
        - name: approval
          secret: {secretName: {{ $.Values.futureLive.approvalSecret }}, optional: true, defaultMode: 0440}
        {{- end }}
        {{- if and $.Values.futureLive.enabled (eq $name "fusion-model") }}
        - name: generative-assets
          persistentVolumeClaim: {claimName: {{ $.Values.futureLive.assetClaim }}, readOnly: true}
        {{- end }}
        - {name: runtime, emptyDir: {medium: Memory, sizeLimit: 16Mi}}
        - {name: tmp, emptyDir: {sizeLimit: 128Mi}}
        - name: config
          configMap: {name: {{ $name }}}
        - name: secrets
          secret:
            secretName: {{ required "existingSecret must name a pre-created Secret" $component.existingSecret }}
            defaultMode: 0440
            {{- if $memoryAgent }}
            # The native caller has CA trust and scoped client tokens only.
            items:
              {{- range $key := list "ca.crt" "fusion-execution-token" "fusion-storage-token" "fusion-messaging-token" "fusion-search-token" "fusion-embedding-token" }}
              - {key: {{ $key }}, path: {{ $key }}}
              {{- end }}
              {{- if $reference }}
              {{- range $role := list "fusion-storage" "fusion-episodes" "fusion-beliefs" "fusion-attention" "fusion-relations" "fusion-exact-search" }}
              - {key: {{ printf "cog-%s-token" $role }}, path: {{ printf "cog-%s-token" $role }}}
              {{- end }}
              {{- end }}
              {{- if $workflow }}
              {{- range $key := list "channel-storage-token" "channel-messaging-token" "fusion-model-token" "measured-fusion-storage-token" "measured-fusion-search-token" "measured-fusion-embedding-token" }}
              - {key: {{ $key }}, path: {{ $key }}}
              {{- end }}
              {{- end }}
            {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: state
        labels: {app.kubernetes.io/instance: {{ $.Release.Name | quote }}, app.kubernetes.io/name: {{ $name }}}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $component.persistence.storageClass | quote }}
        resources: {requests: {storage: {{ $component.persistence.size | quote }}}}
{{- end }}
{{- end }}
